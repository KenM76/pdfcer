[package]
name = "pdfcer-print"
description = "pdfcer printing: printer discovery, device capabilities, page placement and spooling. Platform code, shared by both shells (docs/ARCHITECTURE.md §3). Deliberately NOT in pdfcer-core or pdfcer-render, which must stay platform-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Declared here rather than inherited: the workspace root deliberately
# declares only the internal path dependencies, and each member names its
# own external crates (root manifest, "Internal path dependencies").
thiserror = "2"

# The Win32 printing surface. Confined to this crate on purpose: it is
# the only place in the workspace that talks to a print spooler, and
# keeping it here is what lets `pdfcer-core` and `pdfcer-render` stay
# platform-free for the eventual WASM fork (ARCHITECTURE.md §3).
#
# NOT a new licensing question: `windows` is ALREADY in the workspace
# tree at 0.62 via eframe/winit, MIT-OR-Apache-2.0, and already listed in
# THIRD_PARTY_LICENSES.md. Verified with `cargo tree` before adding
# rather than assumed (rule 13).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    # PRINTER_INFO_2W embeds a SECURITY_DESCRIPTOR pointer, so the struct
    # is feature-gated behind Win32_Security even though pdfcer never reads it.
    "Win32_Security",
    "Win32_Storage_Xps",
] }
