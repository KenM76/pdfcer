[package]
name = "pdfcer-core"
description = "pdfcer PDF engine core: COS object model, parser, writer, filters, fonts, and crypto. GUI-agnostic — zero windowing dependencies (docs/ARCHITECTURE.md §3). Pass 0 scope: header-probe only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
# ---------------------------------------------------------------------------
# STRIPPABLE CAPABILITIES
#
# The operator asked (2026-08-12) whether modules could be stripped to make
# lighter builds. The crate layout allows it; nothing enforced it, and before
# this block `pdfcer-core` declared ZERO features — so the answer was
# "architecturally yes, in practice not yet." This is the mechanism, and the
# convention every future strippable capability follows.
#
# RULES FOR ADDING ONE:
#
# 1. Default ON. A build that omits nothing must behave exactly as it did
#    before the feature existed. A capability that silently disappears from a
#    default build is a regression wearing a feature flag.
# 2. The gated-out path REFUSES BY NAME. Never a silent wrong answer, never a
#    grey box — `ImageCodecError::FeatureUnsupported` and its siblings exist
#    so a build that cannot do something says which thing (rule R27). A lite
#    build that quietly rendered a blank where a JPEG 2000 image belongs would
#    be worse than one that will not open the file.
# 3. The dependency is `optional = true` and named by the feature, so
#    disabling it actually removes the code rather than merely branching
#    around it. `THIRD_PARTY_LICENSES.md` is generated from the SHIPPING
#    graph, so a build that drops a dependency should drop its attribution
#    too.
# 4. CI builds `--no-default-features` (see .github/workflows/ci.yml), which
#    is what stops a `cfg` from rotting into something that no longer
#    compiles when switched off.
default = ["jpx", "ocrs", "signing"]

# Digital SIGNING — the private-key side (PAdES B-B first; `sign` module).
#
# WHAT IS AND IS NOT GATED: verification (`signature_verify`, `cms`, the
# in-crate verify-only arithmetic) is NOT gated — it handles no secret and
# stays in every build. Gated is `sign::pkcs12` (the .pfx importer) and the
# key-operation impls of `sign::Signer` for RSA/ECDSA, i.e. every crate that
# exists to hold a private key — the whole `sign` module, `Signer` trait
# included, is compiled out (`lib.rs`), so a shell-side signer (Pass 10.10)
# needs this feature ON too. A build without it still READS and VERIFIES
# signatures and simply has no `sign`; the CLI's `sign` subcommand does not
# exist in such a build (rule 2 is met by absence, not by a runtime refusal —
# there is no half-present verb to refuse).
#
# Default ON for rule 1. Off is a legitimate lite build — and the build that
# keeps `rsa`'s open RUSTSEC-2023-0071 out of the tree entirely (see the
# dependency block's note: the advisory names a decryption oracle signing never
# runs; a consumer who nonetheless wants it absent has this switch).
signing = [
    "dep:rsa",
    "dep:p256",
    "dep:p384",
    "dep:signature",
    "dep:rand_core",
    "dep:sha1",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:des",
    "dep:rc2",
]

# JPEG 2000 image decoding (`JPXDecode`, ISO 32000-1 §7.4.9 / ITU-T T.800).
#
# The heaviest single codec in the crate and the most rarely needed: JPX
# appears mainly in scanned archival material and in some PDF/A-2 output.
# Without it, a JPX image is refused by name and everything else in the
# document still works.
jpx = ["dep:hayro-jpeg2000"]

# The `ocrs` text-recognition engine (`Pass 71.0` slice 3).
#
# WHAT IS AND IS NOT GATED, because the split is the whole design:
#
#   NOT gated  `ocr::{RecognizedWord, OcrPage, OcrEngine, words_to_page_space}`
#              and `ocr::layer` — the types, the y-flip, and the mode-3
#              sandwich writer. All engine-independent, all pure PDF work, no
#              dependency. A build with this feature off can still WRITE a text
#              layer from words some other source produced.
#   Gated      `ocr::engine_ocrs` — the recogniser itself, and only it.
#
# The operator's engine decision (2026-08-12) was "just build for both", so
# this is the first of two engine features rather than the engine. Naming it
# after the crate rather than the capability (`ocrs`, not `ocr`) is what leaves
# room for the second without a rename.
#
# WHY IT IS ON BY DEFAULT: rule 1 of the strippable-capability convention
# above. OCR is the reason most people reach for a PDF tool at all on scanned
# material; a default build that silently could not do it would be a
# regression wearing a feature flag. Stripping it is a deliberate act for a
# lighter build, and the stripped path REFUSES BY NAME (rule 2) rather than
# returning zero words — "found no text" and "cannot look for text" must never
# be the same answer, least of all on a scan.
#
# LICENCE: `ocrs` and the whole `rten` stack it pulls (11 crates) are
# MIT OR Apache-2.0; `flatbuffers` beneath them is Apache-2.0 only. All
# permissive, zero copyleft, verified against the resolved graph — see
# `docs/ocr-engine-survey.md` §3.2. NOTE that this covers the CODE ONLY. The
# model WEIGHTS are CC-BY-SA-4.0, are not a Cargo dependency, and are
# therefore invisible to `cargo-about`; `tools/check-shipped-assets.py` is
# what covers them (`PROVENANCE.md` + a citation in `about.hbs`).
#
# NO NETWORK, and it is structural rather than promised: the model DOWNLOADER
# lives in the separate `ocrs-cli` binary crate, not in the `ocrs` library, so
# nothing here can fetch anything. Models are loaded from disk through
# `ocr::models::resolve_model_dir`. This is what keeps ARCHITECTURE §1.1's
# privacy posture true without a denylist having to catch it.
ocrs = ["dep:ocrs", "dep:rten"]
# NOTE: there is deliberately no `rten` feature. `cargo add --optional` writes
# one automatically, and it was removed: `rten` alone compiles the inference
# runtime and nothing that uses it, so it would be a public feature that adds
# weight and no capability. The `dep:` prefix above is what suppresses the
# implicit one.

[dependencies]
# thiserror: the ecosystem-standard derive for well-behaved error types
# (Rust API Guidelines C-GOOD-ERR — errors implement std::error::Error and
# are Send + Sync + 'static). License: MIT OR Apache-2.0 (permissive, no
# user flag required per docs/LEGAL.md §6). Added via `cargo add`.
thiserror = "2"

# flate2: FlateDecode (ISO 32000-1 §7.4.4 delegates to RFC 1950/1951 zlib).
# PURE-RUST BACKEND ONLY (`rust_backend` = miniz_oxide; default-features
# off): the C zlib/zlib-ng backends would break the static-single-binary
# packaging invariant (ARCHITECTURE.md §6) and the WASM fork — this is the
# dependency selected by docs/decisions/001-oxidize-pdf-adopt-vs-build.md
# §6.2 and PRIOR_ART.md; never switch backends without a decision-log
# entry. License: MIT OR Apache-2.0 (permissive per docs/LEGAL.md §6).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# brotli: /BrotliDecode -- a PDF Association EXTENSION (EXTN-BROTLI-1 v1.3,
# 2026-08-19), NOT part of ISO 32000-2:2020. `brotli` returns zero hits in
# both ISO editions and Table 6 enumerates exactly ten filters in each; the
# widely-repeated citation "ISO 32000-2:2020 section 7.4.11" is FALSE and
# that clause does not exist. Sourcing:
# D:\Dev\Rag-Specialized\PDF_Spec\filters\filter__brotli.md.
#
# PURE RUST, and that is why this crate rather than a binding to the C
# reference implementation: a C dependency would break the
# static-single-binary packaging invariant (ARCHITECTURE.md section 6) and
# the wasm32 fork, the same constraint that fixed flate2's backend above.
#
# default-features off. The crate's defaults pull its `ffi-api` surface and
# a compressor this filter does not need; `std` + `alloc-stdlib` are the
# decode path. License: BSD-3-Clause AND MIT -- BOTH permissive, so
# docs/LEGAL.md section 6 needs no operator call (project rule 13). Verified
# from the fetched crate metadata, not from a relayed note.
brotli = { version = "8", default-features = false, features = ["std", "alloc-stdlib"] }

# --- Pass 2.1 -------------------------------------------------------
#
# zune-jpeg: DCTDecode (§7.4.8), the highest-value single codec —
# 82% of measured unimplemented-filter instances in the 2,914-file
# corpus (decision 005 §3.1). License MIT OR Apache-2.0 OR Zlib.
#
# default-features = false IS LOAD-BEARING, NOT TIDINESS (R24).
# zune-jpeg's lib.rs carries:
#   #![cfg_attr(not(any(feature = "x86", feature = "neon")),
#               forbid(unsafe_code))]
# so dropping the SIMD features makes the decoder COMPILER-ENFORCED
# zero-unsafe. All 96 unsafe occurrences live in 14 SIMD files that do
# not compile in this configuration. `std` is kept: pdfcer-core is a std
# crate and wasm32-unknown-unknown supports std.
#
# Verified present in 0.5.15: progressive (14% of corpus JPEGs),
# restart intervals (74%), Adobe APP14 transform 0/1/2, the
# 3-component/transform-0 CMYK->RGB fixup, decode_headers() +
# output_buffer_size() + decode_into() for bounded decode, and
# DecoderOptions max_width/max_height/max_scans.
# NOT supported, and each a NAMED diagnostic per R27: arithmetic
# coding, lossless, 12-bit, and the YCCK->CMYK conversion (pdfcer does
# that one itself from a YCCK passthrough).
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# weezl: LZWDecode (§7.4.4 + TIFF 6.0 §13). MIT OR Apache-2.0,
# #![forbid(unsafe_code)], zero required deps, 5 cargo-fuzz targets.
# /EarlyChange maps to the constructor and nothing else:
#   EarlyChange 1 (DEFAULT) -> Decoder::with_tiff_size_switch(Msb, 8)
#   EarlyChange 0           -> Decoder::new(Msb, 8)
# BitOrder::Msb is mandatory — GIF's Lsb packing is a different codec.
# decode_bytes(inp, out) is what makes MAX_DECODED_LEN enforceable
# INCREMENTALLY, as filters/mod.rs already promises for Flate.
#
# NOTE on weezl's ENCODER: it is compiled in (weezl has no decoder-only
# feature) and is used in `#[cfg(test)]` ONLY, to build known-good LZW
# fixtures for the round-trip tests. pdfcer never writes LZW — R28.
weezl = "0.2"

# --- Pass 2.2 -------------------------------------------------------
#
# hayro-ccitt: CCITTFaxDecode (§7.4.6, ITU-T T.4/T.6).
# Apache-2.0 OR MIT, ZERO dependencies, unconditional #![no_std],
# #![forbid(unsafe_code)] + #![forbid(missing_docs)].
# Chosen over `fax` (MIT, 35M downloads, also credible) because its
# DecodeSettings maps 1:1 onto Table 11 — columns/rows/encoding/
# end_of_block/end_of_line/rows_are_byte_aligned/invert_black — which
# keeps the K-sign trichotomy and the BlackIs1 polarity inside a fuzzed
# dependency instead of in our glue. `fax` stays the named fallback.
hayro-ccitt = { version = "0.3", default-features = false }

# hayro-jbig2: JBIG2Decode (§7.4.7, ITU-T T.88). Apache-2.0 OR MIT,
# #![forbid(unsafe_code)]. Image::new_embedded() IS the /JBIG2Globals
# path (Table 12) — no general-purpose JBIG2 decoder exposes it.
# default = ["std","image","simd"]; `image` pulls the image crate and
# `simd` pulls fearless_simd. BOTH OFF (R24).
# The alternatives were all GPL-3.0 C FFI bindings to Artifex jbig2dec,
# untouched since 2020 — see decision 005 §3.5.
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }

# --- Pass 2.3 -------------------------------------------------------
#
# hayro-jpeg2000: JPXDecode (§7.4.9, ITU-T T.800). Apache-2.0 OR MIT,
# unsafe forbidden crate-level. THE ONLY credible pure-Rust JPEG2000
# decoder — 550k downloads vs ~1.9k for the nearest pure-Rust rival;
# everything else in the space wraps OpenJPEG in C.
# Its ColorSpace::{Gray,RGB,CMYK,Unknown{n},Icc{profile,n}} is exactly
# the shape §8.9.5 Table 89 needs, where the CODESTREAM's colour space
# overrides the dict and /BitsPerComponent is ignored if present.
# MSRV 1.92 — identical to pdfcer's, with zero headroom.
#
# VERIFIED at adoption (0.4.0, read from the pinned registry source):
#   src/lib.rs:68  #![forbid(unsafe_code)] — UNCONDITIONAL, not a
#                  cfg_attr like zune-jpeg's; the `simd` feature adds
#                  fearless_simd as a DEPENDENCY, so R24's job here is
#                  keeping that dependency out rather than restoring an
#                  attribute. `image` (off) would pull the image crate
#                  AND moxcms.
#   Image::new     accepts BOTH a JP2 box container and a bare
#                  codestream, sniffed from the first bytes. §7.4.9
#                  mandates the container shape; real producers emit
#                  both, so this is load-bearing rather than a bonus.
#   has_alpha()    reads the JP2 `cdef` box — the hook /SMaskInData
#                  (Table 89) acts on.
# NOT supported, each a NAMED diagnostic per R27: unhandled marker
# segments, of which upstream's own documented gap is progression order
# changes in tile-parts (the POC marker) — see image_codec/jpx.rs's
# error mapping. Note also that its DecodedImage::data_u8() helper is
# deliberately NOT used: it interleaves the opacity channel into the
# colour samples (which /SMaskInData requires us to keep separate) and
# its scaling path shifts by a bit depth a JP2 palette box may declare
# as large as 128.
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std"], optional = true }

# --- Pass 46.x: the JPEG ENCODER (image_import's ImageCompression::Jpeg) ----
#
# jpeg-encoder: writes /DCTDecode (§7.4.8) for
# `image_import::ImageCompression::Jpeg { quality }`. THE FIRST ENCODER in
# the project — R28 forbade one entering without a dated decision, and the
# operator gave that ruling on 2026-08-08 ("accept the ijg attribution
# line").
#
# LICENSE: `(MIT OR Apache-2.0) AND IJG`. Read that conjunction carefully —
# it is the reason this dependency needed an operator decision rather than a
# routine `cargo add`:
#   * `MIT OR Apache-2.0` covers vstroebel's own Rust code (permissive,
#     nothing to do beyond the usual notice).
#   * `AND IJG` is NOT an alternative. It is an ADDITIONAL, simultaneously
#     binding licence, inherited because the quantization/Huffman tables and
#     the FDCT are derived from the Independent JPEG Group's libjpeg. IJG is
#     permissive (no source-disclosure obligation, so nothing here touches
#     pdfcer's own MIT licence — LEGAL.md §6.1), but it carries a real
#     ATTRIBUTION obligation on BINARY redistribution: the sentence
#         "this software is based in part on the work of the
#          Independent JPEG Group"
#     must appear in the documentation shipped with the binary.
#   * That sentence is NOT generated by `cargo-about` — it lists the licence
#     text, not the required acknowledgement. It therefore lives as a STATIC
#     section in `about.hbs` (the cargo-about template), so every
#     regeneration of THIRD_PARTY_LICENSES.md re-emits it and no dependency-
#     set change can drop it. `IJG` is also added to about.toml's `accepted`
#     list — without it `cargo about generate` fails, which is the audit
#     working as designed (LEGAL.md §6.3).
# This is pdfcer's FIRST conjunctive-attribution (`AND`) dependency; every
# prior one was a pure `OR` of permissive licences.
#
# default-features = false IS LOAD-BEARING, NOT TIDINESS (R24), and for the
# same compiler-enforced reason as zune-jpeg above. jpeg-encoder's lib.rs
# carries:
#     #![no_std]
#     #![cfg_attr(not(feature = "simd"), forbid(unsafe_code))]
# so leaving `simd` OFF keeps the encoder COMPILER-ENFORCED zero-unsafe.
# The crate's own default is ["std"]; `std` is kept (pdfcer-core is a std
# crate and wasm32-unknown-unknown supports std) and `simd`/`benchmark` are
# not enabled. Enabling `simd` would trade the `forbid(unsafe_code)` posture
# for x86 AVX2 throughput — do not do it without a decision-log entry.
#
# ZERO dependencies (verified in the pinned 0.7.1 manifest: an empty
# [dependencies] table; jpeg-decoder appears only as a dev-dependency).
# MSRV 1.87, comfortably under pdfcer's 1.92. Pure Rust, so the
# static-single-binary packaging invariant (ARCHITECTURE.md §6) and the WASM
# fork both survive — which is exactly why the C-linked alternatives
# (mozjpeg, turbojpeg) were rejected, quite apart from their licences.
#
# VERIFIED at adoption by reading the pinned registry source, because the
# CMYK polarity trap of decision 006 lives right here (encoder.rs:571-580,
# image_buffer.rs:232-286):
#   ColorType::Cmyk        -> writes APP14 with transform byte 0 AND stores
#                             `255 - input` on all four channels.
#   ColorType::CmykAsYcck  -> writes APP14 with transform byte 2 and stores
#                             `cmyk_to_ycck(p) = (rgb_to_ycbcr(p0,p1,p2),
#                             255 - p3)`.
# BOTH decode, under the never-invert four-engine consensus (R29), to
# `255 - input`. pdfcer therefore feeds the COMPLEMENT of its true-ink CMYK
# samples into `CmykAsYcck`, which reproduces TN #5116 §13.1 exactly
# (`rgb_to_ycbcr(255-C, 255-M, 255-Y)` with K passed through) and lands on
# the transform-2 shape decision 006 verified pixel-perfect against pdfium.
# See `image_import/jpeg_encode.rs` for the full argument and the tests that
# assert it in SAMPLE VALUES.
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
aes = { version = "0.9.2", default-features = false }
cbc = { version = "0.2.1", default-features = false, features = ["alloc", "block-padding"] }
# --- Encryption increment 3: AES-256 at /R 5 --------------------------
#
# sha2: SHA-256 for the `/R` 5 password and key algorithms (Adobe
# Supplement to ISO 32000, ExtensionLevel 3 §3.5, Algorithms 3.2a and
# 3.8-3.13). It is the ENTIRE key derivation at that revision — /R 5
# replaced MD5 outright, and the supplement says so in as many words:
# "encrypt version 5 does not use MD5".
#
# WHY A DEPENDENCY, when md5.rs and rc4.rs are hand-written in-crate.
# `crypto/md5.rs`'s module docs recorded the limit of that judgement
# when they made it: MD5 and RC4 are frozen, tiny and needed only to
# READ what other producers already wrote, and "the reasoning does not
# extend to AES". SHA-256 sits on the AES side of that line, not the
# MD5 side — it is live cryptography with real implementation hazards
# and a well-audited permissive crate one line away. Same call as `aes`
# in increment 2, for the same stated reason.
#
# LICENSE: MIT OR Apache-2.0 (permissive; no operator flag required per
# docs/LEGAL.md §6). Three new packages in total — sha2 0.11.0,
# digest 0.11.3, block-buffer 0.12.1 — every one of them MIT OR
# Apache-2.0. Zero copyleft. THIRD_PARTY_LICENSES.md regenerated via
# cargo-about (rule 13).
#
# default-features = false IS LOAD-BEARING, NOT TIDINESS (R24), though
# for a different reason from the codec crates above. sha2's default
# set is ["alloc", "oid"]; pdfcer's own calls are Sha256::new / update /
# finalize, so `alloc` is unused. `oid` IS on since decision 138
# (2026-09-05) — not from this line but through `rsa`'s optional `sha2`
# dependency (`features = ["oid"]`), because RSASSA-PKCS1-v1_5 needs
# `Sha256: AssociatedOid` for its DigestInfo prefix; it is const-oid
# trait impls only, no backend change, no new unsafe. `zeroize` is off
# deliberately rather than by omission — see the CI step below.
#
# ★ UNSAFE: sha2 is the SECOND dependency whose unsafe cannot be
# switched off by a feature, and it has the SAME SHAPE as `aes`, so it
# falls under decision 039's recorded exception rather than needing a
# new one. Its backends are chosen on a **cfg** (`sha2_backend`,
# `sha2_256_backend`, `sha2_512_backend`, declared in its own
# `[lints.rust.unexpected_cfgs] check-cfg`), and a cfg cannot be set
# from a dependency line — only from RUSTFLAGS or .cargo/config.toml,
# which is global and is NOT inherited by anyone consuming pdfcer-core
# as a library. Five unsafe sites, all in sha256.rs's backend dispatch.
# It enables NO extra feature on `aes`, so 039's boundary is untouched
# by its arrival. `.github/workflows/ci.yml` asserts alloc/zeroize stay
# off, on all four targets, in the same shape as the `aes` check (the
# guard caught `oid` arriving on 8a18e53; decision 138 admitted it).
sha2 = { version = "0.11.0", default-features = false }

# ---------------------------------------------------------------------------
# SIGNING — the private-key side (feature `signing`, default ON).
#
# Decision 129 barred the in-crate verify-only arithmetic (crypto/bignum.rs,
# crypto/ecdsa.rs — correct, slow, NOT constant-time) from ever touching a
# private key. Signing holds one, so the key operations come from vetted
# constant-time crates. Chosen 2026-09-05 from docs/signing-crate-survey.md
# (the "LEAN" stack: 48 crates resolved, 32 new to the lock, wasm32-clean, one
# pre-release pin). Every crate below is MIT OR Apache-2.0 / Apache-2.0 OR MIT
# (permissive — rule 13, no operator flag); THIRD_PARTY_LICENSES.md regenerated.
#
# rsa: RustCrypto, 0.10 release-candidate line — the ONLY constant-time pure-
#   Rust RSA (crypto-bigint 0.7 Montgomery modexp; the 0.9 stable line is the
#   NON-constant-time num-bigint-dig one and is not acceptable here).
#   ★ RUSTSEC-2023-0071 ("Marvin") is still open against every version. Read the
#   survey §2 before touching this: the residual channel (rsa#626/#680) is the
#   PKCS#1 v1.5 DECRYPTION de-padding oracle, which signing never executes; the
#   modexp channel (#19) was closed 2026-01-07. pdfcer signs ONLY through the
#   `Randomized*` (blinded) paths — the plain `Signer` impls skip blinding.
#   `getrandom` feature deliberately OFF (it drags getrandom 0.4 which breaks
#   wasm32; pdfcer feeds its own crypto::rng through a rand_core adapter, and
#   RSA signing refuses on wasm32 exactly as encryption authoring does).
# p256/p384 + signature: stable (Jul 2026), RFC 6979 deterministic ECDSA — no
#   RNG, so ECDSA signing works on wasm32 too. `pkcs8` feature = PrivateKeyInfo
#   import from the .pfx key bag.
# sha1/hmac/pbkdf2/des/rc2: the PKCS#12 (RFC 7292) import plumbing — the
#   Appendix B KDF and MAC are SHA-1 by construction in every legacy .pfx, and
#   the legacy bag ciphers are 3-key-3DES and 40-bit RC2. Read-only (import);
#   pdfcer never WRITES a .pfx and never authors a SHA-1 signature.
# cbc gains `alloc` + `block-padding` for PKCS#7 unpadding of those bags.
# ---------------------------------------------------------------------------
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["sha2", "encoding"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
signature = { version = "3.0", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
des = { version = "0.9", default-features = false, optional = true }
rc2 = { version = "0.9", default-features = false, optional = true }
# ocrs: the pure-Rust OCR engine (`Pass 71.0` slice 3, gated by the `ocrs`
# feature above, which carries the full rationale).
#
# WHY THIS ONE, out of the field surveyed in `docs/ocr-engine-survey.md`:
# it is the ONLY candidate that passes pdfcer's wasm32 CI gate. Every
# alternative would have made OCR the first capability that cannot cross into
# the web fork — which is the exact cost the GUI-core separation invariant
# exists to avoid paying. PaddleOCR via `ocr-rs` covers 50+ languages and is
# Apache-2.0, but has no WASM; Surya was REJECTED outright and must not be
# re-evaluated on its accuracy figures, because its weights carry a modified
# Open RAIL-M licence with a $5M revenue cap, and a field-of-use restriction
# cannot be bundled in an MIT application.
#
# License: MIT OR Apache-2.0. Permissive; no operator flag required
# (docs/LEGAL.md §6). The 11-crate `rten` runtime beneath it is likewise
# MIT OR Apache-2.0 throughout, with Apache-2.0-only `flatbuffers` at the
# bottom — still permissive. The MODEL WEIGHTS are a separate question with a
# separate answer; see the feature comment.
ocrs = { version = "0.12.2", optional = true }
# rten: the inference runtime `ocrs` runs its two models on. A DIRECT
# dependency because `ocrs` does NOT re-export it, and `OcrEngineParams`'s
# fields are typed `rten::Model` — so constructing the engine at all requires
# naming this crate. Gated by the same `ocrs` feature; it has no independent
# use here. License: MIT OR Apache-2.0.
rten = { version = "0.24", optional = true }

# getrandom: the CSPRNG for encryption AUTHORING (`Pass 5.4`) — salts, IVs and
# the 256-bit file encryption key of Algorithms 8/9, which the standard
# requires be "generated with a strong random number generator". TARGET-GATED
# OFF wasm32 exactly as pdfcer-cli gates `windows`: getrandom 0.2 emits a
# compile_error on wasm32-unknown-unknown with no backend feature, and
# encryption authoring is a save operation that the web fork (a viewer) never
