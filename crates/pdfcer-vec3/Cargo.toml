[package]
name = "pdfcer-vec3"
description = "pdfcer three-component vector arithmetic on [f64; 3]: add, sub, scale, dot, cross, and a length / normalize that scale before squaring. No dependencies; shared by pdfcer-3d, pdfcer-3d-nav and pdfcer-core's 3D view code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["vector", "3d", "geometry", "math"]
categories = ["mathematics", "graphics"]

# No dependencies, deliberately: pdfcer-core reaches this unconditionally
# (its 3D measurement builder is not behind the `3d` feature), so anything
# added here is added to every core build.
[dependencies]
