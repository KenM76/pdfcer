[package]
name = "pdfcer-fetch"
description = "pdfcer operator-initiated downloads: pinned URL + SHA-256 verification, for OCR model weights and future add-ins. NETWORK code, shared by both shells. Deliberately NOT in pdfcer-core or pdfcer-render, which must stay network-free (docs/ARCHITECTURE.md §1.1, R12 as narrowed 2026-08-13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
# ---------------------------------------------------------------------------
# STRIPPABLE CAPABILITY — and the FIRST one that does not live in pdfcer-core.
#
# The operator's instruction (2026-08-13): "if we add these they should be
# modular in the same ways as out other features. if someone doesn't include
# the crate in the package then that removes the feature."
#
# The four rules from `pdfcer-core`'s `[features]` header apply unchanged:
# default ON, the gated-out path REFUSES BY NAME, the dependency is
# `optional = true` so disabling actually removes the code, and CI builds
# `--no-default-features`.
#
# ★ WHAT IS NEW ABOUT THIS ONE. Every other strippable capability (`jpx`,
# `ocrs`) lives in `pdfcer-core` and is FORWARDED OUTWARD to the shells. This
# one cannot: `pdfcer-core` and `pdfcer-render` stay network-free permanently and
# gate-enforced, so there is nowhere in core for it to sit. Hence a sibling
# crate — exactly the shape `pdfcer-print` already established for platform
# code ("Deliberately NOT in pdfcer-core or pdfcer-render, which must stay
# platform-free"), with `network` in place of `platform`.
#
# ★ AND THE GUARANTEE THAT WAS LOST IS NOT LOST — IT MOVED.
#
# Before 2026-08-13, "no HTTP client exists in this binary, verifiable by
# anyone reading `cargo tree`" was a project-wide constraint. It is now a
# BUILD CONFIGURATION: build without this feature and the claim is true again,
# verifiable exactly as before. `THIRD_PARTY_LICENSES.md` is generated from the
# shipping graph, so such a build also drops the whole TLS stack's attribution
# automatically. Nothing was given up; an option was gained.
default = ["download"]

# HTTPS download with SHA-256 verification.
#
# Without it, every entry point still exists and returns
# `FetchError::FeatureUnsupported` by name — never a silent no-op, and never a
# "download failed" that an operator would waste time debugging as a network
# problem when the binary simply cannot do it (rule 2 of the convention).
download = ["dep:ureq"]

[dependencies]
# thiserror: ecosystem-standard derive for well-behaved error types
# (Rust API Guidelines C-GOOD-ERR). License: MIT OR Apache-2.0.
thiserror = "2"

# sha2: the SHA-256 used to verify a downloaded artifact against its pinned
# hash. NOT optional and NOT behind the feature, deliberately — verification
# is useful without the downloader (an operator-supplied file can be checked
# against the same manifest), and a verifier that disappears with the fetcher
# would make the stripped build weaker than it needs to be.
# License: MIT OR Apache-2.0.
sha2 = "0.10"

# ureq: blocking HTTPS client. Chosen over `reqwest` because this crate makes
# ONE kind of request — GET a pinned URL to a file — and `reqwest` would bring
# an async runtime (`tokio`) to do it. Blocking is also the honest shape here:
# the caller is a CLI subcommand or a GUI worker thread, neither of which has
# a reactor to join.
#
# LICENCES, verified against the resolved graph rather than assumed:
#   ureq              MIT OR Apache-2.0
#   rustls            Apache-2.0 OR ISC OR MIT
#   ring              Apache-2.0 AND ISC        <- conjunctive, BOTH apply
#   rustls-webpki     ISC
#   untrusted         ISC
#   webpki-roots      CDLA-Permissive-2.0       <- a DATA licence, see below
# All permissive; zero copyleft added to the graph.
#
# ★ `webpki-roots` carries CDLA-Permissive-2.0 — the Linux Foundation's
# Community Data License Agreement — because what it ships is not really code
# but Mozilla's trusted ROOT CERTIFICATE STORE. `cargo about generate` FAILED
# on that id until it was added to `about.toml`'s accepted list, which is a
# licence-acceptance decision and was therefore put to the operator, who
# accepted it on 2026-08-13. See `about.toml` for the full rationale.
ureq = { version = "3", optional = true }
