# cargo-about configuration — generates THIRD_PARTY_LICENSES.md from the
# real Cargo.lock (docs/LEGAL.md §6.3). Run: `cargo about generate about.hbs
# -o THIRD_PARTY_LICENSES.md`. Regenerate whenever the dependency set changes
# and before any packaging pass (docs/ARCHITECTURE.md §6, §9).
#
# The `accepted` list is deliberately PERMISSIVE-ONLY. If a dependency (or a
# transitive one) carries a copyleft license (MPL/LGPL/GPL/AGPL) that is not
# in this list, `cargo about generate` FAILS and names the offending crate —
# which is exactly the license audit docs/LEGAL.md §6 mandates. A copyleft
# dependency is never silently accepted; it is surfaced to the user, and
# only added here after a deliberate, recorded decision. Do not add MPL-2.0
# or any *GPL id to this list to "make the error go away."
#
# NOTE: all top-level keys must appear BEFORE the [private] table header —
# in TOML every key after a table header belongs to that table.

# Only harvest licenses for the target(s) pdfcer actually distributes today.
# Windows-first per docs/ARCHITECTURE.md §6; add macOS/Linux/wasm triples
# here when those artifacts are actually shipped (avoids pulling in
# platform-only deps' licenses for platforms we don't distribute yet).
targets = ["x86_64-pc-windows-msvc"]

# Build- and dev-dependencies are not shipped in the binaries, so their
# licenses don't need attribution in the distributed artifact.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Permissive software SPDX ids only. Alphabetical for easy diffing.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # IJG — the Independent JPEG Group's license, reached via `jpeg-encoder`
    # (SPDX `(MIT OR Apache-2.0) AND IJG`; the AND is CONJUNCTIVE, so this id
    # must be accepted or `cargo about generate` fails). It is PERMISSIVE:
    # no source-disclosure obligation, nothing that touches pdfcer's own MIT
    # license (docs/LEGAL.md §6.1). What it does carry is an ATTRIBUTION
    # obligation on binary redistribution — the sentence "this software is
    # based in part on the work of the Independent JPEG Group" — which
    # cargo-about does NOT generate. That sentence lives as a static
    # "Required acknowledgements" section in about.hbs so every regeneration
    # re-emits it. Do not add this id without that section, and do not
    # remove that section while this id is here.
    # Accepted by operator decision 2026-08-08 ("accept the ijg attribution
    # line"); pdfcer's FIRST conjunctive-attribution dependency.
    "IJG",
    "ISC",
    # CDLA-Permissive-2.0 — the Linux Foundation's *Community Data License
    # Agreement*, reached via `webpki-roots`, which is the dependency that
    # carries Mozilla's trusted root-certificate store for `rustls`.
    #
    # ★ IT IS A DATA LICENSE, NOT A SOFTWARE LICENSE, and that is why it is a
    # DIFFERENT CATEGORY rather than just another id in the list — the same
    # distinction the bundled-font block below already draws. `webpki-roots`
    # ships almost no code; what it ships is a compiled-in LIST OF CERTIFICATE
    # AUTHORITIES. CDLA-Permissive-2.0 governs that data.
    #
    # PERMISSIVE, with an unusually short obligation: redistribute the text of
    # the agreement with the data, and do not remove the attribution. There is
    # **no share-alike clause at all** — 2.0 deliberately dropped the
    # "Results" reciprocity that CDLA-Sharing-1.0 has, which is precisely the
    # difference between the two and the reason the `-Permissive` suffix is
    # load-bearing. Nothing touches pdfcer's own MIT license (LEGAL.md §6.1).
    #
    # WHY IT APPEARS AT ALL: pdfcer needs an HTTPS client for operator-initiated
    # downloads (`R12` as narrowed 2026-08-13 — the SHELLS may fetch, the
    # engine may not). Pure-Rust TLS means `rustls`, and verifying a server
    # certificate means having a root store. The alternative is `native-tls`,
    # which uses the OS store and therefore bundles no root data and needs no
    # new license family — heavier on Windows, and rejected in favour of this.
    #
    # Accepted by operator decision 2026-08-13 ("yes it can join the accepted
    # list"), after `cargo about generate` FAILED on it and the choice was put
    # to him rather than made here — this list's own comment above requires
    # exactly that.
    "CDLA-Permissive-2.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # --- Bundled-FONT licenses (a distinct category from the software
    # licenses above). egui's default font set (epaint_default_fonts) embeds
    # the Ubuntu font and OFL-licensed faces. These govern the FONT FILES,
    # not pdfcer's code: both permit embedding/redistribution and impose only
    # an attribution obligation (satisfied by reproducing their notices in
    # THIRD_PARTY_LICENSES.md). Neither constrains pdfcer's own (MIT, chosen
    # 2026-08-01 — this comment said "still undecided" until 2026-08-07)
    # software license the way a copyleft *software* dependency
    # would — the OFL's "derivatives stay OFL" clause applies to modified
    # fonts, which pdfcer does not create; it only embeds them. Flagged to the
    # user and to be recorded in docs/PRIOR_ART.md.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Skip pdfcer's own crates (all publish = false) — we attribute third-party
# code, not our own.
[private]
ignore = true
