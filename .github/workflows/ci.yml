# pdfce CI
#
# NOTE (2026-07-23): this workflow is scaffolded ahead of the Cargo
# workspace it gates — pdfce is pre-Pass-0 as of this commit, so
# `pdfce-core`/`pdfce-render`/`pdfce-gui`/`pdfce-cli` don't exist yet.
# It targets the workspace layout documented in docs/ARCHITECTURE.md
# §3 and will start actually running (rather than erroring on missing
# packages) once Pass 0 creates the workspace. This is expected, not a
# bug — see docs/ROADMAP.md Pass 0 acceptance criteria. Nothing has
# been pushed to a hosted remote yet, so no failing run is visible
# anywhere until that changes.
#
# Every job here corresponds to a binding rule in
# .claude/agents/pdfce-engineer.md and docs/ROADMAP.md's Standing
# rules — this is the automated enforcement for what was previously
# an honor-system, self-checked-each-session set of rules.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --all --check
      # `cargo fmt --all` formats WORKSPACE MEMBERS only, so every crate in
      # Cargo.toml's `exclude` list (the difftest oracle, the corpus sweep
      # tools, the fuzz harness) is unreachable by the step above — not
      # exempt from project rule 10, just invisible to the command that
      # enforces it. On 2026-08-12 that gap held unformatted code in eight
      # crates, and one crate that was in neither `members` nor `exclude` and
      # so was invisible to every workspace-wide gate at once.
      - run: python3 tools/check-fmt-excluded.py
      # Non-Cargo files pdfce REDISTRIBUTES (fonts, icons, and — once the
      # engine choice lands — OCR model weights) carry licence obligations
      # that `cargo-about` is structurally incapable of seeing, because it
      # reads Cargo.lock and nothing else. This is the only thing that checks
      # them. See tools/check-shipped-assets.py for why a gap between two
      # tools is where an obligation goes missing without anyone deciding to
      # drop it.
      - run: python3 tools/check-shipped-assets.py

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - run: cargo test --workspace --all-features
      # THE STRIPPABLE-CAPABILITY GATE.
      #
      # `pdfce-core` declares default-ON features for capabilities that can be
      # compiled out to make lighter builds (see its Cargo.toml). Nothing else
      # exercises the switched-OFF path, so without this step a `cfg` rots the
      # moment someone adds code inside a gated module that a lite build cannot
      # compile — and nobody finds out until they try to make one.
      #
      # Measured 2026-08-12: dropping `jpx` takes ~310 KB off pdfce-cli. The
      # gate has to keep working for that to stay true.
      - run: cargo test -p pdfce-core --no-default-features
      # THE FORWARDING GUARD — the other half of the gate above.
      #
      # Cargo will not let a member override an inherited `default-features`,
      # so the workspace root sets `default-features = false` on pdfce-core
      # and every consumer re-enables what it wants. A crate that forgets its
      # forwarding block does NOT fail to build — it silently loses the
      # capability. That happened to pdfce-gui for the length of one commit on
      # 2026-08-12: `cargo tree -p pdfce-gui -i hayro-jpeg2000` came back
      # empty and nothing else complained.
      #
      # So the DEFAULT build of each shell is asserted to still contain the
      # codec. This checks a capability, not a manifest, which is why it would
      # have caught that regression.
      - name: default shell builds still carry the optional codecs
        shell: bash
        run: |
          set -e
          for p in pdfce-cli pdfce-render; do
            if ! cargo tree -p $p -i hayro-jpeg2000 2>/dev/null | grep -q hayro-jpeg2000; then
              echo "::error::$p's DEFAULT build no longer contains hayro-jpeg2000 — it is missing a forwarding [features] block, so a capability was dropped silently (see pdfce-core/Cargo.toml)"
              exit 1
            fi
          done

  gui-core-separation:
    name: verify pdfce-core / pdfce-render have zero GUI deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # See docs/ARCHITECTURE.md §3 invariant: pdfce-core and
      # pdfce-render must never depend on egui/eframe/winit/wgpu (a
      # headless CPU rasterizer like tiny-skia is fine — it's not a
      # windowing/GUI-toolkit crate). This is what keeps the future
      # WASM/web fork a shell-crate swap instead of a rewrite.
      # Each crate is checked twice: once for the runner's native (Linux)
      # graph and once for the SHIPPED Windows graph — decision 003 §3.5
      # found the native-only check evaluates a different dependency tree
      # (237 crates vs 147) and could miss a Windows-only violation.
      # `cargo tree --target` is metadata-only; no installed target needed.
      - name: cargo tree -p pdfce-core (fail on GUI/windowing deps)
        run: |
          set -e
          for t in "" "--target x86_64-pc-windows-msvc"; do
            if cargo tree -p pdfce-core $t 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
              echo "::error::pdfce-core has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
              exit 1
            fi
          done
      - name: cargo tree -p pdfce-render (fail on GUI/windowing deps)
        run: |
          set -e
          for t in "" "--target x86_64-pc-windows-msvc"; do
            if cargo tree -p pdfce-render $t 2>/dev/null | grep -Ei '(^|[[:space:]])(egui|eframe|winit|wgpu)([[:space:]]|$)'; then
              echo "::error::pdfce-render has a GUI/windowing dependency — violates the GUI-core separation invariant (docs/ARCHITECTURE.md §3)"
              exit 1
            fi
          done
      # Decision 004 rule R21: pdfce-render pins skrifa to the version
      # epaint already resolves, so exactly ONE copy of the fontations
      # stack exists in the binary. Two majors appearing here means the
      # egui bump landed without bumping pdfce-render's pin in the same
      # commit — fix the pin, don't silence the guard.
      - name: cargo tree --duplicates guard (fontations + image codecs)
        run: |
          set -e
          if cargo tree --duplicates 2>/dev/null | grep -E '^(skrifa|read-fonts|font-types|zune-jpeg|zune-core|weezl|hayro-ccitt|hayro-jbig2|hayro-jpeg2000) v'; then
            echo "::error::multiple versions of the fontations stack or an image codec in the graph — a second copy doubles binary size AND means one of them is unaudited (decision 004 R21, decision 005 §6.2)"
            exit 1
          fi
      # Decision 005 rule R24: the image-codec crates are built with
      # their SIMD/unsafe features OFF, and that is a LOAD-BEARING
      # safety property rather than tidiness — zune-jpeg's lib.rs
      # carries
      #   #![cfg_attr(not(any(feature = "x86", feature = "neon")),
      #               forbid(unsafe_code))]
      # so the feature set is what decides whether pdfce's JPEG decoder
      # is compiler-enforced zero-unsafe. All 96 of its unsafe
      # occurrences live in 14 SIMD files that do not compile with those
      # features off; the hayro-* codecs behave the same way with `simd`.
      #
      # THE CHECK ASSERTS THE FEATURE STATE, NOT THE DEPENDENCY LIST.
      # That distinction is the whole point: Cargo feature unification is
      # transitive and silent, so if anything anywhere in the graph ever
      # enables the `image` crate's `jpeg` feature — which pulls
      # zune-jpeg with its defaults — pdfce's decoder quietly stops being
      # forbid(unsafe_code) with NO reviewable diff. `cargo tree -e
      # features` is the only view that shows it.
      #
      # Scoped to the codec crate names on purpose: miniz_oxide and
      # tiny-skia legitimately carry `simd` features (pre-existing, Pass
      # 1), and a blanket grep would fail on those and teach everyone to
      # ignore the check.
      #
      # Enabling any codec SIMD feature requires a NEW decision record,
      # a measurement showing it matters, and fuzz coverage of the
      # enabled path — not a CI edit.
      - name: R24 — assert codec crates have SIMD/unsafe features OFF
        run: |
          set -e
          codecs='zune-jpeg|zune-core|weezl|hayro-ccitt|hayro-jbig2|hayro-jpeg2000'
          fail=0
          for p in pdfce-core pdfce-render; do
            for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
              if cargo tree -p "$p" -e features $t 2>/dev/null \
                   | grep -E "($codecs) feature \"(x86|neon|simd|portable_simd)\""; then
                echo "::error::$p $t enables a SIMD/unsafe feature on an image-codec crate — this removes zune-jpeg's compiler-enforced forbid(unsafe_code) (decision 005 R24). Requires a NEW decision record, not a CI change."
                fail=1
              fi
            done
          done
          exit $fail
      # Decision 039: `aes` is the ONE dependency in pdfce-core whose
      # unsafe cannot be turned off by a feature. Its intrinsic backends
      # are selected on a **cfg** (`aes_backend = "soft"`), and a cfg
      # cannot be set from a dependency line — only from RUSTFLAGS or
      # .cargo/config.toml, which is global and, crucially, is NOT
      # inherited by anyone consuming pdfce-core as a library. So the
      # hardware backend was accepted deliberately rather than forced
      # off with a guarantee that would be true for pdfce's own builds
      # and false for every downstream consumer.
      #
      # THE EXCEPTION IS BOUNDED TO EXACTLY THAT. This check asserts the
      # two things still under our control:
      #
      #   - `hazmat` stays OFF. It exposes raw round functions with no
      #     key schedule, exists for building other ciphers, and nothing
      #     in pdfce needs it. It is the only feature that widens the
      #     unsafe surface beyond backend dispatch.
      #   - `zeroize` stays OFF, and that is a considered choice rather
      #     than an omission: `FileKey` holds the file encryption key in
      #     an ordinary `Vec<u8>`, so zeroizing only the cipher's round
      #     keys would be theatre. If key-material hygiene is ever taken
      #     seriously it must start at `FileKey`, and this line should
      #     be revisited in that same change, not before.
      #
      # Turning either on requires a new decision record, same bar as
      # R24 itself.
      - name: decision 039 — assert `aes` carries no extra features
        run: |
          set -e
          fail=0
          for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
            if cargo tree -p pdfce-core -e features $t 2>/dev/null \
                 | grep -E 'aes feature "(hazmat|zeroize)"'; then
              # No backticks around 'aes' here: inside a double-quoted shell
              # string they are COMMAND SUBSTITUTION, so bash runs `aes`,
              # splices its empty output, and prints "on the  crate" -- the
              # message loses the one word it exists to say. It fires only on
              # failure, so it would have stayed broken until the day someone
              # needed it.
              echo "::error::pdfce-core $t enables an extra feature on the aes crate. Decision 039 accepted ONLY the intrinsic backend (which is cfg-selected and cannot be disabled per-dependency); hazmat/zeroize are separate widenings and need a new decision record."
              fail=1
            fi
          done
          exit $fail
      # Decision 039 EXTENDED — `sha2`, added for AES-256 at /R 5 (encryption
      # increment 3). Not a new decision: `sha2` has the SAME SHAPE as `aes`
      # and is covered by 039's recorded exception rather than needing its own.
      #
      #   - Its backends are selected on a **cfg** too --
      #     `sha2_backend` / `sha2_256_backend` / `sha2_512_backend`, declared
      #     in its own `[lints.rust.unexpected_cfgs] check-cfg` -- so exactly
      #     as with `aes`, a dependency line cannot force the soft backend and
      #     a `.cargo/config.toml` that did would not be inherited by anyone
      #     consuming pdfce-core as a library. Five `unsafe` sites, all in
      #     `sha256.rs`'s backend dispatch.
      #   - It does NOT enable `hazmat` or `zeroize` on `aes`, so 039's
      #     existing boundary is untouched by its arrival. (`digest`'s
      #     `block-api` feature IS enabled -- by sha2 itself, unconditionally,
      #     as its own dependency. That is not a feature pdfce selects and not
      #     one it can turn off.)
      #
      # THE EXCEPTION IS BOUNDED TO EXACTLY THAT, and this asserts the three
      # things still under our control. `sha2`'s default feature set is
      # ["alloc", "oid"]; pdfce takes it with `default-features = false`, so
      # all three below are OFF and must stay off:
      #
      #   - `alloc` / `oid` are not needed: pdfce calls `Sha256::new`,
      #     `update` and `finalize` and nothing else. `oid` in particular
      #     drags in const-oid for an ASN.1 identifier no PDF path uses.
      #   - `zeroize` stays OFF for the SAME reason it does on `aes`, and the
      #     reason is stronger here rather than weaker: `FileKey` holds the
      #     file encryption key in an ordinary `Vec<u8>`, and at /R 5 the
      #     SHA-256 output IS a key-unwrapping key. Zeroizing the hash state
      #     while the key it produced sits in a plain Vec would be theatre.
      #     Revisit at `FileKey`, in the same change, or not at all.
      - name: decision 039 (extended) — assert `sha2` carries no extra features
        run: |
          set -e
          fail=0
          for t in "" "--target x86_64-pc-windows-msvc" "--target aarch64-apple-darwin" "--target wasm32-unknown-unknown"; do
            if cargo tree -p pdfce-core -e features $t 2>/dev/null \
                 | grep -E 'sha2 feature "(alloc|oid|zeroize)"'; then
              # Same no-backticks rule as the step above, and for the same
              # reason: this string is double-quoted, so a backtick would run
              # the enclosed word as a command and silently delete it from the
              # message. The comment is repeated rather than cross-referenced
              # because the mistake is made while typing THIS line.
              echo "::error::pdfce-core $t enables an extra feature on the sha2 crate. Decision 039 (extended to sha2) accepted ONLY the cfg-selected intrinsic backend; alloc/oid/zeroize are separate widenings and need a new decision record."
              fail=1
            fi
          done
          exit $fail

  # ★ RENAMED 2026-08-30 (`Pass 185.0`). This job was `ui-strings` and was
  # named after its FIRST step, which it had been since the day it ran only
  # that step. It now runs twenty, spanning strings, disclosures, docs,
  # filings and the ledger -- and CI reports failures BY JOB, so a filing
  # gate going red announced itself as a string check that was perfectly
  # clean. That cost a diagnostic cycle and, worse, made the local gate
  # runner look wrong.
  #
  # The count in the name is enforced by `tools/check-ci-job-names.py`,
  # the last step below: an honest collective name is easy to write once
  # and the COUNT is the part that decays, so the count is the part a gate
  # can falsify.
  audits:
    name: repository audits (19 checks)
    runs-on: ubuntu-latest
    steps:
      # ★ FULL HISTORY REQUIRED, and its absence was SILENT.
      #
      # `check-commits-filed.py` walks every commit and skips the ones that
      # only touch `docs/`. actions/checkout defaults to `fetch-depth: 1` —
      # a ONE-COMMIT clone. A shallow boundary commit has no parent to diff
      # against, so git reports it as adding every file in the tree, and a
      # docs-only filing commit was therefore classified as a CODE commit
      # and reported unfiled.
      #
      # The gate did not error. It printed a confident, specific, WRONG
      # list, and it had been doing so for as long as this job has existed.
      # Reproduced locally with `git clone --depth 1` before fixing —
      # byte-identical output to the CI failure.
      #
      # The script now also refuses to run on a shallow clone rather than
      # trusting this line to stay correct.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # (The three gates that read ONLY the in-repo GUI crate —
      # check-ui-strings.sh, check-disclosure-channel.sh and
      # check-theme-colors.sh — were deleted with that crate in Pass 247.0.
      # A gate over a directory that no longer exists fails for a locator
      # reason, not a correctness one. The GUI is now the separate
      # pdfcer-gui project and carries its own gates.)

      # (Once the THIRD side of one surface: R1 asked whether the words live
      # where they can be reviewed, the disclosure channel asked whether they
      # can be SEEN to have been said — both GUI-only, both gone with the
      # crate.) This asks whether outcome fields are said AT ALL.
      #
      # `pdfce-core` returns outcome structs whose fields exist solely to
      # discharge rule 4 -- what pdfce decided, inferred, renamed or dropped.
      # A field no shell reads is a disclosure that does not happen, and the
      # effect is identical to never having computed it.
      #
      # Nothing type-checks that. `#[must_use]` is about the struct, not its
      # fields: reading ONE field consumes the value and satisfies the
      # compiler forever. `Pass 106.1` added three fields to `MergeOutcome`
      # and `merge-document` never grew the tokens -- three numbers computed,
      # returned and discarded, one of them describing a cross-file breakage.
      # It was found by the librarian while filing an unrelated Pass, by luck.
      - name: check every outcome field is surfaced by a shell
        run: python tools/check-outcome-disclosed.py

      # ------------------------------------------------------------------
      # ★★ THE EIGHT GATES THAT EXISTED AND CI DID NOT RUN
      #
      # Added 2026-08-21, and the gap is worth recording rather than quietly
      # closing: `tools/` held FIFTEEN check scripts and this workflow
      # invoked SIX. The other nine ran only when somebody remembered to run
      # them locally -- which is exactly the "green because nobody looked"
      # failure these scripts were each written to end, one level up.
      #
      # The ratio was itself mis-filed twice before it was measured: one
      # session recorded "3 of 16", the next corrected it to "5 of 14", and
      # both were derived by reading rather than by counting. `ls tools/check-*`
      # and a grep over this file are the only two commands that answer it.
      #
      # `check-image-colorspace-truth.py` is deliberately NOT here: it takes a
      # fixture directory as an argument and checks a corpus, not the repo, so
      # it is a sweep tool rather than a gate. Naming the omission so the next
      # person counting does not record a ninth miss.
      # ------------------------------------------------------------------

      # Every document mutation goes through `EditSession` -- the invariant
      # that keeps undo, the dirty set and the save-time diff able to see
      # everything that happened.
      - name: check no mutation bypasses EditSession
        run: bash tools/check-bypass-paths.sh

      # A consuming project builds against `docs/core-api/`. A verb missing
      # from it is a verb whose only description is whatever somebody said
      # once in chat -- which is how a wrong `insert_pages` disclosure shipped
      # in the GUI. Also re-derives the stated line counts, because a
      # published figure nobody re-derives goes stale silently.
      - name: check every public verb is documented and the counts agree
        run: python tools/check-core-api-verbs.py

      # clap derives every subcommand's `--help` from the doc comment on its
      # `Command` variant, so a variant with no doc ships a BLANK description
      # and nothing in the build notices -- not clippy, not missing_docs
      # (private items in a binary crate), not any test, because no test reads
      # help text. Found `extract-text`'s help welded onto `list-outline`, then
      # `print-preview` and `render-page` shipping blank, all live at HEAD.
      - name: check every subcommand carries operator help text
        run: python tools/check-clap-help.py

      # A refusal message names the verb that DOES handle the case. Nothing
      # else checks those names: they compile, they are &'static str, and no
      # test asserts on them. Two were phantoms -- `rotate_widget` and
      # `set_dimension_label` -- read by an operator at the moment they were
      # blocked, naming a way out that did not exist.
      - name: check refusal messages cite verbs that exist
        run: python tools/check-cited-verbs-exist.py

      # `render-page`'s stdout line is a published contract written down three
      # times: the `println!` that emits it, the `//!` template a consumer
      # reads, and an `assert_eq!` in the tests. Only the test copy is under
      # test, so only the test copy could not drift -- and the template drifted
      # by 28 of 87 keys before anyone noticed, in a run that stayed green the
      # whole time. R212: the updated copy is evidence of nothing, because the
      # test FORCES its copy while nothing forces the published one.
      - name: check the metrics line matches its published template
        run: python tools/check-metrics-line-contract.py

      # Pass IDs, standing rules and decision numbers are hand-assigned across
      # documents no compiler reads. Duplicate-number detection in
      # ARCHITECTURE.md §12 is deliberately absent, so the printed ceiling
      # this produces is the only thing standing between two decisions and the
      # same number.
      - name: check the ledger numbers have no duplicates
        run: python tools/check-ledger-numbers.py

      # Operator ruling 2026-08-25: the licensed print-conformance suite pdfce
      # measures itself against is not named anywhere in this PUBLIC repository
      # -- not in contents, not in file names. The gate has a bootstrapping
      # problem it solves by holding its needles base64-encoded: a check for
      # "this word must never appear", written as a plain grep, makes the gate
      # itself the rule's first violation. It also never echoes an offending
      # line, because CI logs on a public repository are public too.
      - name: check the licensed suite is not named anywhere
        run: python tools/check-suite-name-absent.py

      # A backslash escape routed through a Bash-tool heredoc loses one level
      # and lands in the file as the CONTROL BYTE it named: `\b` becomes a
      # backspace, `\n` a bare newline inside a literal. The 392nd filing
      # found three backspaces in ROADMAP/SESSION_LOG that had rendered
      # `D:\builds` as `D:uilds` for days; nothing else fails on them. This is
      # the mechanical inverse of the written rule: it makes the mistake fail.
      - name: check no prose or source file carries a stray control byte
        run: python tools/check-control-bytes.py

      # In clap-derive a `///` doc comment IS the shipped `--help` text, and
      # only its FIRST line becomes the short summary. A doc block whose real
      # summary sits in the middle therefore ships a --help line describing a
      # DIFFERENT command, and nothing fails: it compiles, tests pass, and the
      # operator reads the wrong sentence.
      #
      # Two pre-existing instances were found on 2026-08-29 by running
      # `pdfce-cli --help` and reading it, which no test did: `fetch-ocr-models`
      # advertised itself as "Render a page to a PNG image", and `print`
      # advertised itself as the command that does NOT print. Both were a
      # paragraph spliced at a line offset that landed inside the PRECEDING
      # variant's doc comment -- a mechanical editing error, so it recurs and
      # is mechanically detectable.
      - name: check no subcommand summary is buried in its doc comment
        run: python tools/check-cli-help-leads.py

      # One operator gesture is ONE undo entry (R179/R49). A `commit()` inside
      # a loop is N entries for one gesture, and leaves earlier commits
      # standing when a later iteration fails -- the `import_form_data` defect
      # exactly.
      - name: check a command commits once
        run: python tools/check-one-commit-per-command.py

      # The sibling of `check-commits-filed.py`, for commits that CLAIM a Pass
      # ID. Filing a Pass and filing a COMMIT are two different acts and only
      # the second decays silently; both gates green together is the state
      # worth defending.
      - name: check every Pass-claiming commit is filed
        run: python tools/check-passes-filed.py

      # The THIRD member of that family, and the one that catches a decay the
      # other two structurally cannot: a commit hash the documents CITE which
      # is no longer an ancestor of HEAD.
      #
      # `git commit --amend` and any rebase rewrite the commit. The old object
      # survives as a dangling commit, so `git show` keeps working and the
      # citation reads as healthy -- until `git gc` collects it, after which the
      # citation points at nothing and is repairable only from its subject line.
      # The two gates above only examine commits that CLAIM a Pass; an ordinary
      # citation claims nothing and was invisible to both.
      #
      # Found by accident on 2026-08-27 (an amend minutes after the filing was
      # dispatched), and a sweep then turned up FOURTEEN pre-existing ones from
      # earlier sessions. This job exists so the next one is found on purpose.
      #
      # ★ Needs `fetch-depth: 0`, like its two siblings -- reachability cannot
      # be decided on a shallow clone, and the script refuses to report clean
      # there rather than passing vacuously.
      - name: check every cited commit is still on main
        run: python tools/check-cited-commits-exist.py

      # A setting parsed, validated, defaulted and read by NOTHING is a
      # preference the operator sets and pdfce ignores. The inbound twin of
      # the outcome gate above: that one catches values computed and never
      # told, this one catches values told and never honoured.
      - name: check every persisted setting is consumed
        run: python tools/check-settings-consumed.py

      # A baked-in gap in an operator-facing string -- the artefact of a
      # wrapped Rust literal losing its continuation backslash -- ships as a
      # sentence with a ten-space hole in it. Nothing else catches it: it
      # compiles, it formats, and it reads correctly in source.
      - name: check no operator-facing string has a baked-in gap
        run: bash tools/check-string-gaps.sh

      # A public function with no doc comment violates CLAUDE.md rule 6, and
      # -- the reason this is a gate rather than a habit -- it is the
      # OBSERVABLE SYMPTOM of a doc block that was silently corrupted.
      #
      # When a splice welds two `///` blocks together, the surviving block
      # keeps a first sentence describing the item that lost its
      # documentation, and the item itself turns up bare. `cmyk_buffer.rs`
      # shipped exactly that: `mark_dirty` opened with "Write one pixel,
      # clamping into range", which is `set_pixel`'s job. rustfmt, clippy
      # and `doc_lazy_continuation` are all content with a contiguous weld.
      #
      # 73 pre-existing violations are carried in a baseline file that is
      # DEBT, not an allowlist -- the gate fails on anything outside it.
      - name: check every public fn has a doc comment
        run: python tools/check-public-fns-documented.py

      # Every command THIS FILE runs has a local story: covered by the gate
      # sweep, covered by a named local stand-in, or deliberately CI-only.
      #
      # Added 2026-08-21 after `cargo fuzz build` had been red for three
      # days while every local check was green -- and neither signal was
      # wrong. The habit called "run the gates" is `tools/check-*`, which is
      # ONE of this workflow's nine jobs (ten runs -- `test` is a two-OS
      # matrix); the other eight had no local equivalent anybody ran. This
      # gate cannot make them run, and does not try. What it makes
      # impossible is adding a tenth without somebody deciding, in writing,
      # whether one exists.
      #
      # It is in THIS job rather than its own because it is a text audit of a
      # file already checked out here, and a job that costs a container to
      # grep one YAML is a job people delete.
      - name: check every CI command has a local runner
        run: python tools/check-ci-parity.py

      # A job's name is the first thing anybody reads when CI goes red, and
      # this job's name described one of its nineteen steps for eighteen days
      # -- during which the finding was already written up in
      # `D:/dev/rag/rust/`, correct and complete and scheduled against
      # nothing. This step is the scheduling.
      #
      # It checks two decidable things: a job over the threshold declares a
      # count, and a declared count is right. It deliberately does NOT judge
      # whether a name is a fair description -- that is not decidable from
      # text, and the gate says so rather than pretending.
      - name: check a many-check job says how many
        run: python tools/check-ci-job-names.py

      # Every CODE commit is named in the record. `check-passes-filed.py`
      # already covers commits that CLAIM a Pass ID; most claim none, and
      # for those it is blind — which is how eleven commits, including a
      # dropped-transparency fix and the removal of a third party's
      # confidential material, reached HEAD with no roadmap presence at all.
      #
      # Both times that backlog was discovered it was an accident. This is
      # the exhaustive walk that replaces the accident. See the script's
      # header for the ratchet, and why the known debt lives in a file
      # rather than in a green gate that guards nothing.
      #
      # LAST in this job, deliberately (394th filing, 2026-09-03). By R217's
      # design a filing gate is red on every push that carries a code
      # commit ahead of its filing; when it sat sixth, a red here left the
      # sixteen steps after it UNRUN, including a new gate's first CI run.
      # A step that is expected to be red sometimes must not hide verdicts
      # that are never expected to be.
      - name: check that every code commit is filed
        run: python tools/check-commits-filed.py

  cross-check:
    name: cross-target compile check (macOS / wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,wasm32-unknown-unknown
      # WHAT THIS PROVES: the workspace type-checks for these targets.
      # WHAT IT DOES NOT PROVE: that it links, runs, or opens a window.
      # macOS is NOT a supported platform (rule R9) — this job exists to
      # keep the code portable, not to claim it runs there. See
      # docs/decisions/003-distribution-posture.md §3.1 and §5.3.
      #
      # ★ `pdfce-fetch` IS EXCLUDED, and the reason corrects a premise this
      # comment used to state as fact. It read:
      #
      #     "`cargo check` needs no linker and no platform SDK, which is
      #      why this runs at ubuntu rates instead of macOS rates"
      #
      # That is true of RUST code and false of BUILD SCRIPTS. `cargo check`
      # still RUNS build scripts, and `pdfce-fetch` pulls `ureq` → `rustls`
      # → `ring`, whose build script compiles C. Cross-compiling that C from
      # a Linux runner to `aarch64-apple-darwin` needs an Apple-targeting
      # toolchain the runner does not have, and it fails with
      # `cc: error: unrecognized debug output level 'full'` — `ring` passing
      # a Clang flag to the runner's GCC.
      #
      # This job had therefore been RED since before 2026-08-15, on a
      # failure that has nothing to do with pdfce's portability, which is
      # the worst state for a gate: it reports a problem that is not there
      # and so stops being read.
      #
      # WHAT IS CONSEQUENTLY NOT CHECKED, stated rather than gestured at
      # (`a_gate_states_what_it_cannot_see`, D:/dev/rag/rust): `pdfce-fetch`
      # is not type-checked for macOS by this job. It is excluded from the
      # wasm32 check below for the same reason it exists (it is a native
      # network shell, and R12 forbids the engine from having one), and it
      # is still fully type-checked on ubuntu and windows by `cargo test`.
      #
      # ★★ THE PARAGRAPH ABOVE USED TO SAY `pdfce-fetch` HAD "NO DEPENDENTS
      # IN THE WORKSPACE", AND ENDED WITH THIS WARNING:
      #
      #     "If it ever gains a dependent, this exclusion silently widens
      #      — that is the thing to watch."
      #
      # It gained one. `Pass 129.0` (2026-08-25) made `pdfce-cli` depend on
      # it with the `download` feature DEFAULT ON, this job went red at the
      # `v0.12.0` tag, and the prediction had been sitting two lines above
      # the failure the whole time.
      #
      # ★ THE CORRECTION IS THE FACT, NOT THE WARNING. The warning was
      # already perfect and it did not help: nobody reads a CI comment
      # before adding a Cargo dependency. What WOULD have helped is the
      # sentence beside it being true — "no dependents" is checkable in one
      # `grep`, and a reader who checks a false premise finds the trap. So
      # the standing claim is now written to stay checkable:
      #
      #   `pdfce-cli` depends on `pdfce-fetch` behind its OPT-IN `download`
      #   feature (NOT default, `crates/pdfce-cli/Cargo.toml`). A default
      #   `cargo check --workspace` therefore does not build it, which is
      #   why this exclusion still means what it says.
      #
      # ★★★ AND THE THING TO WATCH IS NOW DIFFERENT, so it is restated
      # rather than left pointing at a hazard that already fired: this
      # exclusion holds only while `download` is OFF BY DEFAULT. Flip that
      # default and `ureq -> rustls -> ring` re-enters the tree, `ring`
      # needs a C compiler and target assembly, and this job goes red
      # again. `--exclude` drops a package from the BUILD LIST; it does not
      # stop something else dragging it in. **`--exclude` is not
      # isolation.**
      #
      # Deliberately NOT fixed by widening the exclusion. That was the
      # convenient repair and it ends with a check that no longer checks
      # anything; the architectural fix (opt-in) restores
      # `ARCHITECTURE.md` §1.1's claim that a default pdfce build carries
      # no network stack, which default-on had made false for every build
      # anybody would actually make.
      #
      # NOT DONE, and it is a real gap rather than an oversight: this job
      # does not pass `--all-features`, so the `download` path is never
      # cross-checked at all. `--all-features` here would go red
      # immediately on the same `ring` toolchain gap, so turning it on
      # needs the toolchain question answered first. The feature IS
      # type-checked natively — `--all-features` runs on ubuntu and
      # windows — so it cannot silently rot; it is only its PORTABILITY
      # that is unmeasured.
      - run: cargo check --workspace --exclude pdfce-fetch --target aarch64-apple-darwin
      # The web-fork invariant, checked positively rather than only by
      # the absence of GUI crates: pdfce-core + pdfce-render must stay
      # WASM-compilable (ARCHITECTURE.md §3, §1). pdfce-cli is
      # deliberately excluded — it is a native shell.
      - run: cargo check -p pdfce-core -p pdfce-render --target wasm32-unknown-unknown

  no-network:
    name: verify the ENGINE needs no network (core + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # ARCHITECTURE.md §1.1 / decision 003 rule R12, AS NARROWED BY THE
      # OPERATOR ON 2026-08-13. Verbatim: "the no network rule was made
      # too broad. all I meant by that is the software itself didn't rely
      # on network technology to function which would bloat it and slow
      # things down the way it does for other pdf software. it is fine to
      # have download update or download addin capability."
      #
      # SO THE SUBJECT SET SHRANK FROM FOUR CRATES TO TWO, and the line
      # this job now enforces is the operator's own: what the software
      # needs to RUN, versus what the operator can ASK it to fetch.
      #
      #   ENFORCED  pdfce-core, pdfce-render -- the ENGINE. Parsing and
      #             rendering a file must never require a network, and
      #             this has a SECOND independent justification: both
      #             crates must cross into the wasm32/web fork, where a
      #             native HTTP stack does not exist.
      #   ALLOWED   pdfce-cli, tools/ -- the SHELLS. Operator-
      #             initiated fetching (model downloads, updates,
      #             add-ins) is explicitly permitted.
      #
      # WHAT THIS DOES NOT RELAX, and the distinction is the whole point:
      # no telemetry, no usage analytics, no crash reporting, no licence
      # callback, no silent phone-home. The operator narrowed ONE clause;
      # that is not consent to widen the neighbouring one. A network call
      # that happens without the operator asking still needs §1.1's
      # opt-in treatment and a decision record.
      #
      # ★ R192 -- WHAT THIS GATE CANNOT SEE, enumerated rather than
      # gestured at:
      #   - It reads the CARGO GRAPH, so it cannot see a raw socket
      #     opened through `std::net`, which needs no dependency at all.
      #     Nothing checks for that.
      #   - It cannot see a network call in a BUILD SCRIPT or proc macro
      #     (`cargo tree` without `-e build,proc-macro`).
      #   - It says nothing about the shells, BY DESIGN as of 2026-08-13
      #     -- so "CI is green" is no longer evidence that pdfce as a
      #     whole makes no network calls. It is evidence about the engine
      #     only.
      #   - It cannot distinguish an operator-initiated fetch from a
      #     silent one. That obligation is enforced by review and by the
      #     decision-record requirement, not here.
      #
      # NOT on the denylist, deliberately: `url` (a parser) and
      # `webbrowser` (hands a URL to the OS browser; unconditionally
      # linked by eframe 0.35 and not removable -- see decision 003
      # §3.4). Also not `zbus` -- the Linux accessibility D-Bus bridge, a
      # local IPC socket, which is why this check runs against the
      # SHIPPED Windows target.
      - name: cargo tree denylist (ENGINE crates, shipped target)
        run: |
          set -e
          deny='reqwest|ureq|hyper|isahc|attohttpc|curl|surf|native-tls|openssl|rustls|webpki|tokio|socket2|hickory|trust-dns'
          fail=0
          for p in pdfce-core pdfce-render; do
            if cargo tree -p "$p" --target x86_64-pc-windows-msvc 2>/dev/null \
                 | grep -Ei "(^|[[:space:]])($deny)[[:space:]]"; then
              echo "::error::$p is an ENGINE crate and has a network-client dependency. Parsing and rendering must never require a network (ARCHITECTURE.md §1.1, R12 as narrowed 2026-08-13), and both crates must compile for wasm32 where no native HTTP stack exists. The SHELLS may fetch on the operator's behalf; these two may not. Adding one here requires a NEW decision record."
              fail=1
            fi
          done
          exit $fail

  third-party-licenses:
    name: third-party license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      # NOTE: the `cli` feature is REQUIRED — without it cargo-about installs
      # no binary (`cargo about` then reports "no such command"). --locked
      # keeps the tool's own build reproducible.
      - run: cargo install cargo-about --locked --features cli
        # (about.hbs also carries the hand-maintained "Embedded data & font
        # assets" epilogue — non-crate assets cargo-about can't see; see the
        # REGENERATION NOTE inside about.hbs and docs/LEGAL.md §6.3.)
      # Regenerating is itself the license audit: about.toml accepts only
      # permissive (+ bundled-font) SPDX ids, so `generate` FAILS if any
      # dependency (transitive included) carries an unaccepted copyleft
      # license — that is the gate (docs/LEGAL.md §6). We intentionally do
      # NOT `git diff --exit-code` the output: cargo-about's rendering is not
      # guaranteed byte-identical across OSes/tool versions, which would make
      # a diff check flaky. Enforcing "no unaccepted license enters the tree"
      # is the invariant that matters; keeping the committed file fresh is a
      # release-time step (docs/ARCHITECTURE.md §6).
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md

  fuzz-smoke:
    name: fuzz targets build (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/ARCHITECTURE.md §10.2: the cargo-fuzz targets are part of the
      # shipping criteria of every Pass that added one — see
      # fuzz/fuzz_targets/*.rs for the invariant each asserts.
      #
      # ★ This comment named EIGHT targets and listed them by hand, and
      # the list had been wrong for months — the same stale-count defect
      # `R212` is about, in the one place nobody re-reads, because
      # `cargo fuzz build` compiles every target in fuzz/Cargo.toml and
      # needs no per-target wiring here. A hand-maintained list beside an
      # automatic mechanism has nothing forcing it to stay true, so it is
      # now a pointer rather than a list.
      #
      # ★★ AND THE FIX SHIPPED A HAND-MAINTAINED **COUNT** IN PLACE OF THE
      # HAND-MAINTAINED LIST. It read "There are 24 (measured 2026-08-25,
      # `ls fuzz/fuzz_targets/*.rs | wc -l`)" — dated, sourced with the
      # exact command, and correct on the day. Five days later there are
      # 27. **Sourcing a figure makes it auditable, not durable**, and the
      # replacement inherited the whole defect it was written to remove.
      # The count is deleted rather than corrected or gated: run the
      # command above if the number matters, which is the same answer the
      # list already got.
      #
      # ★★ AND THIS JOB HAS A BLIND SPOT WORTH NAMING HERE, because this
      # is where someone will look. It runs on `ubuntu-latest`. On
      # 2026-08-25 the whole harness was found unbuildable on Windows/MSVC
      # — `rten` (pulled by the default `ocrs` feature) declares
      # `crate-type = ["lib", "cdylib"]`, and the cdylib link is handed
      # libFuzzer's `/include:main`, which a `.so` on Linux is never asked
      # for. This job was GREEN throughout. A `windows-latest` sibling is
      # owed and is filed to Backlog; until it exists, this job proves the
      # targets compile, not that they LINK on the platform pdfce is
      # developed on.
      #
      # writer_roundtrip (Pass 3.0, decision 007 R40) is the first
      # WRITE-direction target: it asserts the ARCHITECTURE.md §5
      # round-trip invariant in all three of its distinct shapes
      # (whole-file identity for an empty-dirty-set incremental save;
      # prior-bytes-intact for an append; per-object-definition identity
      # for a full rewrite). `cargo fuzz build` compiles every target in
      # fuzz/Cargo.toml, so no per-target wiring is needed here.
      #
      # BUILDING them is the CI check:
      # it proves the harnesses stay in sync with pdfce-core's API so a
      # local `cargo +nightly fuzz run <target>` always works. Actual
      # fuzz CAMPAIGNS stay manual/local — minutes-long runs in CI buy
      # little coverage and cost every push. The fuzz/ crate is
      # deliberately OUTSIDE the workspace (root Cargo.toml `exclude`),
      # so no other job compiles it — without this job, an API drift
      # would go unnoticed until someone next fuzzes locally.
      # libFuzzer needs nightly (-Z sanitizer flags), hence the
      # separate toolchain from the 1.97.1 jobs above.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
