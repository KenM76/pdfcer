<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>pdfcer probe-lookup bench</title></head>
<body style="margin:0;font:14px monospace"><canvas id="c"></canvas><pre id="out" style="position:fixed;top:0;left:0;background:#fffc;margin:0;padding:6px">running…</pre><script>
// Pass 705.0: the cost of decision 224's bounce lookup per pixel, on the device that opens this page.
// Per pixel: 8 probes around the point (manual trilinear), each an octahedral irradiance texel read
// with manual bilinear (4 texelFetch) from one RGBA32F atlas, plus 1 depth-moment texelFetch per probe
// for visibility weighting: 40 texelFetch per pixel, no hardware filtering (NEAREST only).
// It reports ms per full-canvas pass, with and without the lookup, at the canvas's device-pixel size.
const out = document.getElementById("out"), lines = [];
const log = s => { lines.push(s); out.textContent = lines.join("\n"); };
try {
  const c = document.getElementById("c");
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(innerWidth * dpr); c.height = Math.round(innerHeight * dpr);
  c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
  const gl = c.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false });
  if (!gl) throw new Error("no WebGL 2");
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  log("renderer: " + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  log(`canvas: ${c.width}x${c.height} device pixels`);
  // 4,096 probes (16^3), 8x8 octahedral irradiance + 1-texel border = 10x10 tiles; 64x64 tiles.
  const P = 16, TILE = 10, A = 64 * TILE;
  const irr = new Float32Array(A * A * 4);
  for (let i = 0; i < irr.length; i++) irr[i] = ((i * 2654435761) >>> 0) / 4294967296;
  const vis = new Float32Array(64 * 64 * 4);
  for (let i = 0; i < vis.length; i++) vis[i] = 0.5 + ((i * 40503) % 1000) / 2000;
  function tex(unit, w, h, data) {
    const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  }
  tex(0, A, A, irr); tex(1, 64, 64, vis);
  const vs = `#version 300 es
  void main(){ vec2 p[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); gl_Position=vec4(p[gl_VertexID],0,1);}`;
  const head = `#version 300 es
  precision highp float; precision highp int;
  uniform highp sampler2D u_irr; uniform highp sampler2D u_vis; uniform vec2 u_size; out vec4 o;
  // A synthetic world position and normal per pixel, so every pixel's probes and texels differ.
  vec3 world(){ vec2 q=gl_FragCoord.xy/u_size; return vec3(q*15.0, 7.5+7.0*sin(q.x*9.0+q.y*7.0)); }
  vec3 normal(){ vec2 q=gl_FragCoord.xy/u_size*6.2831; return normalize(vec3(cos(q.x),sin(q.y),0.6)); }
  vec2 octa(vec3 n){ n/=abs(n.x)+abs(n.y)+abs(n.z); vec2 e=n.xy; if(n.z<0.0) e=(1.0-abs(n.yx))*sign(n.xy); return e*0.5+0.5; }
  vec3 fetch_irr(ivec2 tile, vec2 uv){
    vec2 t=uv*8.0+0.5; ivec2 i=ivec2(floor(t)); vec2 f=fract(t); ivec2 b=tile*${TILE}+i;
    vec3 a=texelFetch(u_irr,b,0).rgb, c=texelFetch(u_irr,b+ivec2(1,0),0).rgb,
         d=texelFetch(u_irr,b+ivec2(0,1),0).rgb, e=texelFetch(u_irr,b+ivec2(1,1),0).rgb;
    return mix(mix(a,c,f.x),mix(d,e,f.x),f.y);
  }`;
  const fsLookup = head + `
  void main(){
    vec3 p=clamp(world(),0.0,${P - 1}.0-0.001); ivec3 g=ivec3(floor(p)); vec3 f=fract(p); vec2 uv=octa(normal());
    vec3 sum=vec3(0); float wsum=0.0;
    for(int k=0;k<8;k++){
      ivec3 o3=ivec3(k&1,(k>>1)&1,(k>>2)&1); ivec3 q=g+o3; int id=q.x+${P}*(q.y+${P}*q.z);
      ivec2 tile=ivec2(id%64,id/64);
      vec3 tw=mix(1.0-f,f,vec3(o3)); float w=tw.x*tw.y*tw.z;
      vec4 m=texelFetch(u_vis,tile,0); float var=max(m.y-m.x*m.x,1e-4); float d=length(vec3(o3)-f);
      w*= d<=m.x ? 1.0 : var/(var+(d-m.x)*(d-m.x));
      sum+=w*fetch_irr(tile,uv); wsum+=w;
    }
    o=vec4(sum/max(wsum,1e-6),1);
  }`;
  const fsBase = head + `
  void main(){ vec3 p=world(); vec3 n=normal(); o=vec4(fract(p*0.1)*0.5+n*0.25+octa(n).xyy*0.25,1); }`;
  function prog(fs) {
    const p = gl.createProgram();
    for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    }
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);
    gl.uniform1i(gl.getUniformLocation(p, "u_irr"), 0); gl.uniform1i(gl.getUniformLocation(p, "u_vis"), 1);
    gl.uniform2f(gl.getUniformLocation(p, "u_size"), c.width, c.height);
    return p;
  }
  const progs = { base: prog(fsBase), lookup: prog(fsLookup) };
  const px = new Uint8Array(4);
  function time(p, n) {
    gl.useProgram(p); gl.viewport(0, 0, c.width, c.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // warm
    const t0 = performance.now();
    for (let i = 0; i < n; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // forces completion
    return (performance.now() - t0) / n;
  }
  const N = 60, res = { base: [], lookup: [] };
  for (let r = 0; r < 5; r++) for (const k of ["base", "lookup"]) res[k].push(time(progs[k], N));
  const med = a => a.slice().sort((x, y) => x - y)[a.length >> 1];
  const b = med(res.base), l = med(res.lookup);
  log(`base pass:   ${b.toFixed(3)} ms (median of 5 x ${N} passes)`);
  log(`with lookup: ${l.toFixed(3)} ms`);
  log(`lookup cost: ${(l - b).toFixed(3)} ms per full-canvas pass; ${((l - b) * 1e6 / (c.width * c.height)).toFixed(3)} ns per pixel`);
  log("glError=" + gl.getError());
} catch (e) { log("ERROR " + e.message); }
</script></body></html>
