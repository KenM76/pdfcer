<!doctype html><html><body><pre id="out"></pre><script>
const out = [];
const log = s => out.push(s);
try {
  const c = document.createElement("canvas"); c.width = 1; c.height = 1;
  const gl = c.getContext("webgl2");
  if (!gl) throw new Error("no webgl2");
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  log("renderer=" + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  for (const k of ["MAX_TEXTURE_SIZE","MAX_3D_TEXTURE_SIZE","MAX_ARRAY_TEXTURE_LAYERS","MAX_TEXTURE_IMAGE_UNITS","MAX_COMBINED_TEXTURE_IMAGE_UNITS","MAX_FRAGMENT_UNIFORM_VECTORS"])
    log(k + "=" + gl.getParameter(gl[k]));
  log("EXT_color_buffer_float=" + !!gl.getExtension("EXT_color_buffer_float"));
  log("OES_texture_float_linear=" + !!gl.getSupportedExtensions().includes("OES_texture_float_linear"));
  // Probe-atlas shaped textures: 2D RGBA32F and 3D RGBA32F, full-precision values.
  const W = 640, H = 640, D = 16;
  const val = (x, y, z, ch) => {
    const i = ((z * H + y) * W + x) * 4 + ch;
    // mixes tiny steps near 1, large and small magnitudes, negatives
    const m = i % 7;
    return m == 0 ? 1 + (i % 1048576) * 2 ** -23 : m == 1 ? -(i * 1e-7) : m == 2 ? 3.0e38 / (1 + (i % 97)) :
           m == 3 ? 1e-30 * (1 + i % 13) : m == 4 ? Math.fround(i / 3) : m == 5 ? 0.5 + i * 1e-9 : -(2 ** -126) * (1 + i % 5);
  };
  function make(target, depth) {
    const n = W * H * depth * 4, a = new Float32Array(n);
    for (let z = 0; z < depth; z++) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (let ch = 0; ch < 4; ch++)
      a[((z * H + y) * W + x) * 4 + ch] = val(x, y, z, ch);
    const t = gl.createTexture(); gl.bindTexture(target, t);
    if (depth == 1) gl.texImage2D(target, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, a);
    else gl.texImage3D(target, 0, gl.RGBA32F, W, H, depth, 0, gl.RGBA, gl.FLOAT, a);
    gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    log((depth == 1 ? "tex2d" : "tex3d") + " upload error=" + gl.getError());
    return a;
  }
  const vs = `#version 300 es
  void main(){ vec2 p[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); gl_Position=vec4(p[gl_VertexID],0,1);} `;
  // Each fragment (x,y) fetches the texel and the reference from a second, identical texture
  // uploaded as R32UI bit patterns: compare the float BITS, so any rounding shows.
  function prog(fs) {
    const p = gl.createProgram();
    for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    }
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  function check(label, target, depth, samplerDecl, fetch, refFetch) {
    const ref = new Float32Array(W * H * depth * 4);
    for (let z = 0; z < depth; z++) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (let ch = 0; ch < 4; ch++)
      ref[((z * H + y) * W + x) * 4 + ch] = val(x, y, z, ch);
    const bits = new Uint32Array(ref.buffer);
    gl.activeTexture(gl.TEXTURE0); make(target, depth);
    gl.activeTexture(gl.TEXTURE1);
    const rt = gl.createTexture(); gl.bindTexture(target, rt);
    if (depth == 1) gl.texImage2D(target, 0, gl.RGBA32UI, W, H, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, bits);
    else gl.texImage3D(target, 0, gl.RGBA32UI, W, H, depth, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, bits);
    gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const p = prog(`#version 300 es
    precision highp float; precision highp int; ${samplerDecl}
    uniform int layer; out vec4 o;
    void main(){ ivec2 c=ivec2(gl_FragCoord.xy); vec4 v=${fetch}; uvec4 r=${refFetch};
      bvec4 ok=equal(floatBitsToUint(v), r); o=vec4(all(ok)?1.0:0.0, 0, 0, 1);} `);
    gl.useProgram(p);
    gl.uniform1i(gl.getUniformLocation(p, "t"), 0); gl.uniform1i(gl.getUniformLocation(p, "r"), 1);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    const ct = gl.createTexture(); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ct);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, ct, 0);
    gl.viewport(0, 0, W, H);
    let bad = 0, flushedDenormals = 0;
    const px = new Uint8Array(W * H * 4);
    for (let z = 0; z < depth; z++) {
      gl.uniform1i(gl.getUniformLocation(p, "layer"), z);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (let i = 0; i < W * H; i++) if (px[i * 4] < 128) bad++;
    }
    log(`${label}: texels=${W*H*depth} mismatched_bits=${bad} glError=${gl.getError()}`);
  }
  check("rgba32f 2d texelFetch", gl.TEXTURE_2D, 1, "uniform highp sampler2D t; uniform highp usampler2D r;",
        "texelFetch(t,c,0)", "texelFetch(r,c,0)");
  check("rgba32f 3d texelFetch", gl.TEXTURE_3D, D, "uniform highp sampler3D t; uniform highp usampler3D r;",
        "texelFetch(t,ivec3(c,layer),0)", "texelFetch(r,ivec3(c,layer),0)");
  check("rgba32f 2darray texelFetch", gl.TEXTURE_2D_ARRAY, D, "uniform highp sampler2DArray t; uniform highp usampler2DArray r;",
        "texelFetch(t,ivec3(c,layer),0)", "texelFetch(r,ivec3(c,layer),0)");
} catch (e) { log("ERROR " + e.message); }
document.getElementById("out").textContent = out.join("\n");
</script></body></html>
