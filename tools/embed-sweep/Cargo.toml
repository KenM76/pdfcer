# embed-sweep — runs Pass 67.0 phase E's font EMBEDDING over the real corpus
# and measures what actually happens.
#
# WHY THIS EXISTS. Every other check on this feature is a fixture: a document
# whose exact shape pdfcer chose. That proves each branch works; it cannot
# prove the branches cover what real producers emit, and it cannot answer the
# three questions that decide whether the feature solves the operator's actual
# problem —
#
#     does `not-embedded` reach ZERO?
#     does the file still open and render afterwards?
#     and does the page still look the SAME?
#
# The third is the one this sweep can answer that its `unembed-sweep` sibling
# could not. Unembedding is DEFINED to change how a page looks, so a pixel
# comparison there would measure nothing. Embedding is defined NOT to move
# anything — positions come from `/Widths` — and when the face embedded is
# the same face pdfcer's own renderer was already substituting (`--bundled`),
# the raster must come out BYTE-IDENTICAL. That is a real oracle, not a
# smoke test: it fails if the synthesised widths are wrong, if the written
# `/Differences` maps a code to the wrong glyph, or if the wrong `/FontFile*`
# key was chosen.
#
# It measures. It does not decide, and it does not gate: an unopenable input
# is data about the corpus, not a failure of this feature.
#
# WHY OUT-OF-TREE (workspace-excluded, same as tools/unembed-sweep,
# corpus-report, font-parity, roundtrip, tw-census, difftest): keeps
# `cargo test --workspace` fast, keeps the GUI-core-separation `cargo tree`
# checks unambiguous, and keeps cargo-about's THIRD_PARTY_LICENSES.md a
# picture of the SHIPPING graph only (LEGAL.md §6.3).
#
# ZERO NEW DEPENDENCIES — pdfcer-core and pdfcer-render by path, everything
# else std.
#
# FIXTURE RULE (LEGAL.md §5): reads rights-cleared corpora in place from
# gitignored scratch space, writes its output to a temp directory, and emits
# only aggregates and a per-file TSV. It never modifies a corpus file.

[package]
name = "embed-sweep"
version = "0.0.0"
edition = "2024"
publish = false
# license intentionally unset — internal tool, never shipped or published.

[workspace]

[dependencies]
pdfcer-core = { path = "../../crates/pdfcer-core" }
pdfcer-render = { path = "../../crates/pdfcer-render" }

[profile.release]
opt-level = 3
