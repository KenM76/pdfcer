# Cargo build configuration for the pdfcer workspace.
#
# Statically link the MSVC C runtime on the Windows target so the shipped
# pdfce-gui.exe / pdfcer.exe do NOT require the Visual C++ Redistributable
# (VCRUNTIME140.dll et al.) to be installed on the target machine. This is a
# hard requirement of the single-folder-portable, "no installer, no
# system-wide runtime dependency" goal in docs/ARCHITECTURE.md §6: without
# it the binaries would fail to launch on a clean Windows profile that has
# never had a VC++ redistributable installed.
#
# The remaining runtime dependencies after this are only ever-present OS
# DLLs (kernel32/user32/gdi32/opengl32/…), which ship with Windows itself
# and are not "system-wide runtime dependencies" in the forbidden sense.
#
# Trade-off (documented, deliberate): a static CRT means each binary carries
# its own copy of the CRT (slightly larger exe) and, if pdfcer ever loads a
# dynamic library that assumes a shared CRT heap, allocator ownership needs
# care. Neither applies to the current all-Rust, statically-linked build.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
