# pdfcer fuzzing harness (docs/ARCHITECTURE.md §10.2 — required for Pass 1).
#
# This crate is NOT a member of the shipping workspace: the root
# Cargo.toml lists "fuzz" in `exclude`, and the empty [workspace] table
# below makes this directory its own workspace root. Two load-bearing
# reasons (same rationale as tools/difftest):
#   (1) libfuzzer-sys must never appear in the shipping dependency graph
#       or in the cargo-about-generated THIRD_PARTY_LICENSES.md;
#   (2) the GUI-core-separation `cargo tree` checks stay unambiguous.
#
# Build/run (cargo-fuzz drives nightly itself; no rust-toolchain override
# needed here):
#   cargo +nightly fuzz build                       # compile all targets
#   cargo +nightly fuzz run <target> -- -max_total_time=90
# Targets: every `[[bin]]` below, and `ls fuzz_targets/*.rs` if you want
# the number. This line USED to name eight of them by hand and had been
# wrong for months — the twin of the list `ci.yml` deleted on 2026-08-25,
# found by the librarian's sweep on 2026-08-30 because deleting one copy
# of a hand-maintained list does not find the other one.
# — see the doc comment at the top of each fuzz_targets/*.rs for the
# invariant it asserts.
#
# Windows note: cargo-fuzz builds with AddressSanitizer, whose runtime
# DLL ships with MSVC rather than with rustup, so `cargo fuzz run` needs
# the MSVC bin directory on PATH or the built binary exits immediately
# with a missing-DLL error. See
# D:\dev\rag\rust\cargo_fuzz_windows_msvc_asan_dll_path.md.

[package]
name = "pdfcer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `arbitrary-derive` pulls in `arbitrary`'s derive macro, which the two
# Pass 2.2 bilevel targets need. Decision 005 §6.5 requires the CCITT
# target to fuzz Table 11's PARAMETERS — not just the codestream —
# because CCITT, unlike JPEG, carries no geometry of its own: the row
# stride and the allocation bound come entirely from `/DecodeParms`
# integers. A hand-rolled byte-slicing scheme cannot steer eight
# independent typed parameters plus a present/absent mask; `arbitrary`
# can, and libFuzzer's coverage feedback then drives the cross-product.
#
# This is a fuzz-harness dependency only. The fuzz/ crate is outside the
# shipping workspace (root Cargo.toml `exclude`), so `arbitrary` never
# reaches any pdfcer binary, never appears in `cargo tree -p pdfcer-core`,
# and never enters the cargo-about-generated THIRD_PARTY_LICENSES.md.
# (It is MIT OR Apache-2.0 regardless — no docs/LEGAL.md §6.2 flag.)
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

# ** `default-features = false`, AND IT IS THE DIFFERENCE BETWEEN A FUZZ
# HARNESS THAT BUILDS AND ONE THAT DOES NOT. **
#
# `pdfcer-core`'s default features include `ocrs`, which pulls the `rten`
# inference runtime. `rten` builds a **cdylib**, and cargo-fuzz puts
# libFuzzer's `/include:main` into the link arguments for the whole graph, so
# the cdylib is asked to export a `main` it does not have:
#
#     LINK : error LNK2001: unresolved external symbol main
#     rten-<hash>.dll : fatal error LNK1120: 1 unresolved externals
#
# ** EVERY TARGET IN THIS DIRECTORY FAILED THAT WAY, not just a new one. **
# Measured 2026-08-25 on `parse_object`, which had not been touched since long
# before OCR landed: the harness stopped building the day `Pass 71.0` added
# `ocrs`.
#
# ** AND THE REASON NOBODY NOTICED IS NOT THE ONE THIS COMMENT FIRST GAVE. **
# It said `cargo fuzz build` "is not one of CI's jobs". It IS one -- the job is
# named `fuzz targets build (nightly)` in `.github/workflows/ci.yml`, it runs
# `cargo +nightly fuzz build`, and it has been GREEN throughout, including at
# `0d4165e` the day before this was found. Checked with
# `gh run view <id> --json jobs`, not assumed.
#
# ** The job runs on `ubuntu-latest`, and the break is MSVC-only. ** `rten`
# declares `crate-type = ["lib", "cdylib"]`; on Windows the cdylib link is
# handed libFuzzer's `/include:main` and fails, while the same cdylib on Linux
# becomes a `.so` that no linker asks for a `main`. So CI was not asleep -- it
# was structurally incapable of seeing this, and the LOCAL build was the only
# place it could surface. The usual assumption (CI is the stricter of the two)
# is exactly backwards here.
#
# ⇒ owed, filed to Backlog rather than done in a release commit: a
# `windows-latest` sibling for the fuzz job. Until it exists, a Windows
# `cargo +nightly fuzz build` is a per-session discipline, not a gate
# (`R209`).
#
# No fuzz target needs OCR. `jpx` is kept because `image_codec_jpx` needs it,
# and it is named explicitly rather than inherited, so a future default that
# adds another heavyweight capability does not silently re-break this.
[dependencies.pdfcer-core]
path = "../crates/pdfcer-core"
default-features = false
features = ["jpx"]

# pdfcer-render, for the FF-C donor-subsetting target (Pass 21.0). The
# subsetter lives there, not in core, because producing a subset requires
# parsing the donor and core has no font parser (decision 021 §3.2, R21).
#
# This does NOT weaken the GUI-core-separation check: the fuzz crate is
# outside the shipping workspace (root Cargo.toml `exclude`), so it never
# appears in `cargo tree -p pdfcer-core` / `-p pdfcer-render` and cannot
# pull anything into a shipped binary.
[dependencies.pdfcer-render]
path = "../crates/pdfcer-render"
# Same reason as `pdfcer-core` above, and it MUST be repeated here: cargo
# unifies features across the graph, so one crate taking defaults re-enables
# `ocrs` for everybody (the effect `pdfcer-render/Cargo.toml`'s own feature
# block documents, measured on 2026-08-12).
default-features = false
features = ["jpx"]

# cargo-fuzz builds with the release profile; keep debuginfo so crash
# backtraces point at real source lines.
[profile.release]
debug = 1

[[bin]]
name = "parse_object"
path = "fuzz_targets/parse_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "load_document"
path = "fuzz_targets/load_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_and_filters"
path = "fuzz_targets/content_and_filters.rs"
test = false
doc = false
bench = false

# Pass 2.1 (decision 005 §6.5): fuzz the ADAPTER, not the vendor's
# codec core — zune-jpeg already has its own targets and transitive
# OSS-Fuzz coverage, so pdfcer's bugs will be in the marker pre-sniff,
# the geometry reconciliation, the buffer sizing and the colour routing.
[[bin]]
name = "image_codec_dct"
path = "fuzz_targets/image_codec_dct.rs"
test = false
doc = false
bench = false

# Pass 2.2 (decision 005 §6.5). Same principle as image_codec_dct — fuzz
# the adapter, not the vendor's codec core (`hayro-fuzz` already carries
# fuzz_ccitt and fuzz_jbig2 upstream). What no upstream target can cover
# is the PDF-side glue: Table 11's parameter cross-product for CCITT, and
# `/JBIG2Globals`'s reference -> stream -> span -> filter-chain
# resolution for JBIG2.
[[bin]]
name = "image_codec_ccitt"
path = "fuzz_targets/image_codec_ccitt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_codec_jbig2"
path = "fuzz_targets/image_codec_jbig2.rs"
test = false
doc = false
bench = false

# Pass 2.3 (decision 005 §6.5). Same principle again, with the sharpest
# glue surface of the four: JPXDecode is the ONE filter whose image
# dictionary does not govern its own samples (Table 89 makes
# /ColorSpace optional, /BitsPerComponent ignored-if-present and /Decode
# ignored outright), so the dictionary and the codestream are steered
# independently here. It also covers the /SMaskInData channel split and
# the marker pre-sniff — a hand-written walk over attacker-controlled
# segment lengths that runs on the error path, which is where a fuzzer
# spends most of its time.
[[bin]]
name = "image_codec_jpx"
path = "fuzz_targets/image_codec_jpx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_subset"
path = "fuzz_targets/font_subset.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace (root Cargo.toml also excludes this
# directory — both halves are required for cargo to treat fuzz/ as
# standalone).
[workspace]
members = ["."]

# Pass 3.0: the write-direction target (decision 007 R40). Asserts the
# ARCHITECTURE.md §5 round-trip invariant in all three of its distinct
# shapes — see the doc comment at the top of the target for why they must
# not be merged into one weaker assertion.
[[bin]]
name = "writer_roundtrip"
path = "fuzz_targets/writer_roundtrip.rs"
test = false
doc = false
bench = false

# Pass 3.2: the composition target (decision 007 R40, extended). The
# writer targets prove a save does not corrupt an untouched document and
# that ONE edit does not perturb its neighbours; this one proves that no
# SEQUENCE of structural operations produces a document pdfcer cannot read
# back, and that undoing all of them reproduces the input byte for byte.
# Structural ops compose in ways single ops do not — a delete shifts the
# indices a following reorder addresses, a reorder changes which ancestor
# a following rotate inherits from — and every one of those is a
# two-operation bug a one-operation target cannot reach.
[[bin]]
name = "pageops_sequence"
path = "fuzz_targets/pageops_sequence.rs"
test = false
doc = false
bench = false

# Pass 4: the extraction target. Three parsers over one input — the
# ToUnicode CMap grammar (§9.10.3, with attacker-controlled arithmetic in
# four places the clause specifies with a `shall` and no recovery), the
# §7.9.2.2 text-string decoder, and the whole stateful content-stream
# walk. It also asserts the per-glyph text-range invariant that every
# consumer of the provenance model slices by, so a range bug surfaces
# here rather than in a caller's `&run.text[..]`.
[[bin]]
name = "text_extract"
path = "fuzz_targets/text_extract.rs"
test = false
doc = false
bench = false

# Pass 6.0 (docs/decisions/008): the annotation-walk target. Drives the
# read-side annotation model — the /Annots walk and the §12.5.5 /AP /N
# appearance selection with its negative-result taxonomy (cyclic /AP,
# degenerate/inverted /Rect, /AS naming a missing state, an /N that is
# neither stream nor dictionary). Shares the loader entry point, so the
# existing corpus keeps its value.
[[bin]]
name = "annot_walk"
path = "fuzz_targets/annot_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annot_author"
path = "fuzz_targets/annot_author.rs"
test = false
doc = false
bench = false

# Target 13: the interactive-form field model (pdfcer_core::forms, §12.7;
# Pass 7). Drives parse_acroform over untrusted input: the /AcroForm walk,
# the /Kids field-tree DFS with inheritance, the field-vs-widget merge, FQN
# construction, per-type /V decoding, and XFA/SigFlags detection. The
# hostile shapes decision 008 names — cyclic /Parent//Kids, huge /Kids,
# merge-shape edge cases, malformed values — must terminate bounded by
# MAX_FORM_FIELDS / MAX_FIELD_TREE_DEPTH and never panic. Shares the loader
# entry point, so the existing corpus keeps its value.
[[bin]]
name = "form_model"
path = "fuzz_targets/form_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fdf_parse"
path = "fuzz_targets/fdf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact_apply"
path = "fuzz_targets/redact_apply.rs"
test = false
doc = false
bench = false

# Decision 013 Pass B: the cross-reference RECOVERY target. `load_document`
# already fuzzes the entry to rebuild-by-scan (from_bytes routes an
# unparseable xref through recovery), so this target adds the
# recovery-SPECIFIC invariants: a recovered document refuses incremental
# save by name (the recovered-base rule), and its save_full output re-loads
# without panicking. The O(n) scan + MAX_XREF_ENTRIES cap + no-catalog
# refusal bound the work (R25); this asserts termination + fail-clean.
[[bin]]
name = "recover_roundtrip"
path = "fuzz_targets/recover_roundtrip.rs"
test = false
doc = false
bench = false

# Pass 9a (decision 011 Appendix A): the vector object-decomposition
# target. Drives `pdfcer_core::vector::decompose` + hit-test + centerline
# over attacker-controlled content streams — the malformed/degenerate
# paths, huge node counts, and unbalanced q/Q the acceptance criterion
# names — asserting the MAX_NODES/MAX_OBJECTS bounds hold and nothing
# panics. Shares the content-stream tokenizer entry with
# `content_and_filters`, so that target's corpus keeps its value here.
[[bin]]
name = "vector_decompose"
path = "fuzz_targets/vector_decompose.rs"
test = false
doc = false
bench = false

# Pass 12.M1 snapping engine: drives `snap_candidates` (incl. the
# neighbourhood-bounded, capped intersection scan — the Z4 path) and the H/V
# constraint math over adversarial content streams + hostile query points,
# asserting panic-freedom, the MAX_NEIGHBOURHOOD_SEGMENTS/MAX_CANDIDATES
# bounds, and the priority-then-distance ordering contract.
[[bin]]
name = "vector_snap"
path = "fuzz_targets/vector_snap.rs"
test = false
doc = false
bench = false

# Pass 9c-min vector-edit surgery: drives the move / delete / drag-node
# operand-rewrite planners (`vector::edit`) over adversarial content streams
# with degenerate coords + huge operands and overrunning node indices,
# asserting panic-freedom and that every refusal is a named `VectorEditError`
# (decision 011 Appendix A Pass 9c-min "Fuzz over operand rewriting ... 0
# crashes").
[[bin]]
name = "vector_edit"
path = "fuzz_targets/vector_edit.rs"
test = false
doc = false
bench = false

# Pass 46.x raster-image import: drives `image_import::import_with` over
# adversarial PNG/JPEG/BMP containers at all four compression policies. Added
# when `ImageCompression::Jpeg` landed pdfcer's FIRST image encoder — the
# passthrough branches copy bytes and the codecs are fuzzed by their own
# targets, but the re-encode path reshapes decoded samples in pdfcer's own
# hand-written stride/bit-packing/palette code before handing them to
# `jpeg-encoder`, and that reshaping is the new surface. See the target's
# doc comment for the invariants and for why the expensive policies run
# behind a pixel-count gate.
[[bin]]
name = "image_import"
path = "fuzz_targets/image_import.rs"
test = false
doc = false
bench = false

# Pass 5 increment 2: AES-128-CBC decryption. The FIRST cipher in this crate
# whose control flow is decided by its own input bytes -- an IV split, a
# block-count truncation, and a PKCS#7 pad length that is READ FROM DECRYPTED
# BYTES and used to truncate a buffer. RC4 and MD5 needed no target because
# neither has an input-derived length or offset anywhere in it; this does.
# The pad byte is post-decryption and therefore effectively random, which is
# precisely what a hand-written fixture cannot steer and libFuzzer gets free.
[[bin]]
name = "crypto_decrypt"
path = "fuzz_targets/crypto_decrypt.rs"
test = false
doc = false
bench = false

# Pass 12.M2 + Pass 69.0: the ce-dimension `/PieceInfo` sidecar reader. Every
# number it consumes comes out of the FILE and becomes geometry (`/Rect`, `/L`)
# or, since the style cascade, a stroke width and a text height. The reader's
# stated contract is that it is total -- a malformed sidecar yields `None` or a
# partial model, never a panic -- and Pass 69.0 widened its input surface by
# nine optional keys per group and thirteen per ce dimension, one of them an
# array and one a token-parsed name. The target drives style RESOLUTION too,
# not just parsing: an inherited absurdity only misbehaves once a file-supplied
# override is combined with a file-supplied group default.
[[bin]]
name = "dimension_sidecar"
path = "fuzz_targets/dimension_sidecar.rs"
test = false
doc = false
bench = false

# Pass 125.0: the mesh-shading stream decoder (ISO 32000-1 8.7.4.5.5-.8).
# A BIT-level parser whose field widths, record stride and record COUNT all
# come out of the file, and whose output size is not bounded by its input
# size -- two-bit coordinates make a type 5 vertex eight bits long, so a
# megabyte of stream is a million vertices before any subdivision. Types 6
# and 7 have no fixed stride at all: the record length depends on an edge
# flag read from the stream, which is the classic length-confusion shape.
[[bin]]
name = "mesh_shading"
path = "fuzz_targets/mesh_shading.rs"
test = false
doc = false
bench = false

# Pass 126.0: the Type 3 font model (ISO 32000-1 9.6.5, Tables 112/113). A
# FONT DICTIONARY parser, which is a shape a fuzzer is unusually good at:
# `/Widths` is a file-controlled array placed at a file-controlled offset in a
# 256-slot table, `/Differences` is a little stack machine that can walk off
# the end of that table, and the glyph lookup crosses two dictionaries whose
# keys disagree in the ordinary case rather than the exotic one.
[[bin]]
name = "type3_font"
path = "fuzz_targets/type3_font.rs"
test = false
doc = false
bench = false

# Pass 167.0: the two CLIPBOARD payload readers. Both parse untrusted bytes
# that arrive from OUTSIDE the process -- a clip is written to a file, put on
# the OS clipboard and read back by a different run -- and both stack two
# attack surfaces: a length-prefixed binary frame whose every count comes out
# of the payload, wrapping COS object syntax re-parsed by the crate's own
# parser. `ObjectClip::from_bytes` shipped in Pass 120.1 with NO fuzz target;
# the gap was found while adding the field clipboard, not by review, because
# a clipboard reads like an internal format and is in fact a file format.
[[bin]]
name = "clipboard_payloads"
path = "fuzz_targets/clipboard_payloads.rs"
test = false
doc = false
bench = false

# `Pass 185.1`: the form-edit WRITE path, and the object-wide action-target
# sweep `Pass 184.0` put underneath it. `form_model` fuzzes the read side only;
# nothing drove `rename_field`, `delete_field` or `set_button_action` against
# untrusted input, and the sweep recurses through EVERY live object of an
# arbitrary document bounded by one constant nobody had ever driven
# (`forms::MAX_ACTION_NEST_DEPTH`). The standing rule asks for a fuzz target
# whenever new code touches untrusted-input parsing; the fuzz half is the one
# this role forgets, twice recorded and twice recurred, so it is written down
# here as well as in the target's own header.
[[bin]]
name = "form_edit_sequence"
path = "fuzz_targets/form_edit_sequence.rs"
test = false
doc = false
bench = false

# `Pass 188.0` — the form-scoped geometry verbs. `vector_edit` drives the
# PLANNERS over one already-parsed content stream and cannot reach any of the
# machinery this Pass added: resolving a leaf index, finding its enclosing
# form, re-decomposing that form from the leaf's placement matrix, refusing a
# selection that spans two invocations, and counting the form's reach across
# the page tree. All of that is index arithmetic and graph-walking over
# attacker-controlled structure (ARCHITECTURE.md §10.2).
[[bin]]
name = "form_geometry_sequence"
path = "fuzz_targets/form_geometry_sequence.rs"
test = false
doc = false
bench = false

# The annotation-DELETION target, and the one named uncovered site `R236`
# created. `annot_walk` reads annotations and `annot_author` writes them;
# NEITHER DELETES, so `delete_annotation`'s router, its four refusals, its
# three cascades (`/Popup` both directions, `/IRT` referrers, appearance
# streams), both delegations (`delete_redaction_mark`, `delete_dimension`)
# and `cut_selection`'s N-into-one undo fold all shipped with zero
# untrusted-input coverage.
#
# `R236`: a `debug_assert` postcondition over state derived from untrusted
# input is a tripwire for a fuzzer, not a guard for an operator, so it owes
# a fuzz target over the verbs it guards or a written exemption at the
# site. `delete_annotation`'s is `!pages_touched.is_empty()` immediately
# before the `/Annots` patch loop, and every input to it -- the page tree,
# the `/Annots` arrays, the object ids -- comes out of the file. The target
# also asserts that postcondition's OBSERVABLE consequence (a deleted
# annotation is no longer listed on any page), so the claim survives a
# build with `debug-assertions` off.
[[bin]]
name = "annot_delete_sequence"
path = "fuzz_targets/annot_delete_sequence.rs"
test = false
doc = false
bench = false

# Pass 10.1: signature VERIFICATION over untrusted bytes. The /Contents of a
# signature is whatever the file says it is, and pdfcer parses it with an
# in-crate DER reader, CMS/X.509 walker, RSA/ECDSA verifier and big-integer
# arithmetic -- every one of them new and on the hostile path. The seeds are
# the seven pyHanko-signed fixtures, so libFuzzer's mutations start from
# real CMS objects and real certificates rather than from noise.
[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false
bench = false

# Pass 248.1: SVG export over untrusted bytes. The export recorder is the
# cache recorder with every refusal replaced by a rasterise-and-harvest
# fallback, so it walks the interpreter on hostile input down paths the
# cache mode never reaches (the scratch harvest, per-op soft-mask layers,
# the SVG writer's encoders over recorder output).
[[bin]]
name = "export_svg"
path = "fuzz_targets/export_svg.rs"
test = false
doc = false
bench = false

# Pass 248.4: EMF export over untrusted bytes, asserting the output is a
# well-formed record chain whatever the input was.
[[bin]]
name = "export_emf"
path = "fuzz_targets/export_emf.rs"
test = false
doc = false
bench = false
